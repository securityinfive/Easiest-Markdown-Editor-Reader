      const body = el.textContent.replace(/\n$/, '');
      newLines = body.split('\n').map(l => (pfx + l).replace(/[ \t]+$/, ''));
      if(newLines.length === 1 && newLines[0] === '' && le < ls) newLines = [];
    } else {
      const isLi = el.classList.contains('itx');
      const kind = /^h[1-6]$/.test(tag) ? 'h' : (isLi ? 'li' : 'p');
      const p = prefixOf(first, kind);
      const cont = isLi ? p.quote + ' '.repeat(Math.max(0, p.pfx.length - p.quote.length)) : p.pfx;
      const text = ser(el, false).replace(/[ \t]+$/gm, '').replace(/^\n+|\n+$/g, '');

      if(host.dataset.setext && le === ls + 1 && lines[le] != null){
        newLines = [p.pfx + text, lines[le]];
      } else {
        const segs = text.split('\n');
        let bodyLines;
        if(segs.length > 1){
          bodyLines = segs.map((s, k) => k < segs.length - 1 ? s + '  ' : s);
        } else if(le > ls && kind !== 'h'){
          bodyLines = wrapText(text, Math.min(120, Math.max(60, longestLine(lines, ls, le))) - cont.length);
        } else {
          bodyLines = [text];
        }
        newLines = bodyLines.map((s, k) => {
          const line = (k === 0 ? p.pfx : cont) + s;
          return /\S {2}$/.test(line) ? line : line.replace(/[ \t]+$/, '');
        });
      }
    }
    spliceSource(ls, le, newLines, host);
  }
  function longestLine(lines, a, b){
    let w = 0;
    for(let k = a; k <= b; k++) w = Math.max(w, (lines[k] || '').length);
    return w;
  }
  const dirtyEls = new Set();
  function queueCommit(el, ms){
    dirtyEls.add(el);
    clearTimeout(commitT);
    commitT = setTimeout(runCommits, ms == null ? 350 : ms);
  }
  function runCommits(){
    commitT = null;
    const els = Array.from(dirtyEls); dirtyEls.clear();
    const lineOf = e => { const h = e.tagName === 'CODE' ? e.parentElement : e; return h ? (+h.dataset.ls || 0) : 0; };
    els.sort((a, b) => lineOf(a) - lineOf(b));   // top-down, so line shifts stay consistent
    els.forEach(commit);
  }
  function flushCommit(){
    if(commitT){ clearTimeout(commitT); commitT = null; runCommits(); }
  }
  // write the block being edited back to the source right now (before save/export)
  function commitActive(){
    if(!state.edit) return;
    const a = document.activeElement;
    flushCommit();
    if(a && a.classList && a.classList.contains('ed') && preview.contains(a)) commit(a);
  }

  /* ---------- caret helpers ---------- */
  function placeCaret(el, atEnd){
    if(!el) return;
    el.focus();
    try {
      const r = document.createRange();
      r.selectNodeContents(el);
      r.collapse(!atEnd);
      const s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
    } catch(err){}
  }
  function caretParts(el){
    const sel = window.getSelection();
    if(!sel.rangeCount || !sel.anchorNode || !el.contains(sel.anchorNode)) return null;
    const r = sel.getRangeAt(0);
    const a = document.createRange(); a.selectNodeContents(el); a.setEnd(r.startContainer, r.startOffset);
    const b = document.createRange(); b.selectNodeContents(el); b.setStart(r.endContainer, r.endOffset);
    const d1 = document.createElement('div'); d1.appendChild(a.cloneContents());
    const d2 = document.createElement('div'); d2.appendChild(b.cloneContents());
    return { before: ser(d1, false).trim(), after: ser(d2, false).trim() };
  }
  function focusPending(){
    if(!pending || !state.edit) return;
    const p = pending; pending = null;
    let el = null;
    if(p.ci != null) el = preview.querySelector('[data-ls="' + p.ln + '"][data-ci="' + p.ci + '"]');
    if(!el){
      const all = preview.querySelectorAll(EDITABLE);
      for(let k = 0; k < all.length; k++){
        const n = all[k], host = n.tagName === 'CODE' ? n.parentElement : n;
        const a = +host.dataset.ls, b = +host.dataset.le;
        if(isFinite(a) && p.ln >= a && p.ln <= Math.max(a, b)){ el = n; break; }
      }
    }
    if(el){ placeCaret(el, !!p.end); try { el.scrollIntoView({ block:'nearest' }); } catch(e){} }
  }

  /* ---------- structural edits ---------- */
  function onEnter(el, e){
    const tag = el.tagName.toLowerCase();
    if(tag === 'code') return;                       // plain newline inside code blocks
    if(tag === 'td' || tag === 'th'){
      e.preventDefault(); flushCommit(); commitCell(el); moveCell(el, 'down'); return;
    }
    const parts = caretParts(el);
    if(!parts) return;                                  // caret unknown → leave the block alone
    e.preventDefault();
    const ls = +el.dataset.ls, le = +el.dataset.le;
    if(!isFinite(ls)) return;
    flushCommit();
    const lines = srcLines();
    const first = lines[ls] || '';
    const isLi = el.classList.contains('itx');
    const kind = /^h[1-6]$/.test(tag) ? 'h' : (isLi ? 'li' : 'p');
    const p = prefixOf(first, kind);
    const mk = first.slice(p.quote.length).match(/^([ \t]*)([-*+]|\d{1,9}[.)])([ \t]+)(\[[ xX]\][ \t]+)?/);
    const nextMarker = () => {
      let m = mk ? mk[2] : '-';
      if(/^\d/.test(m)) m = (parseInt(m, 10) + 1) + m.slice(-1);
      return p.quote + (mk ? mk[1] : '') + m + (mk ? mk[3] : ' ') + (mk && mk[4] ? '[ ] ' : '');
    };
    const trimKeepBreak = l => /\S {2}$/.test(l) ? l : l.replace(/[ \t]+$/, '');

    // --- caret at the end: start a fresh block without re-rendering everything
    if(parts.after === ''){
      if(isLi && parts.before === ''){                  // empty item → end the list
        const ln2 = srcLines(); ln2[ls] = ''; applyLines(ln2);
        const li = el.closest('li'), list = li && li.parentElement;
        if(list){
          li.remove();
          const np = synthBlock('p', ls + 1, ls);
          list.parentNode.insertBefore(np, list.nextSibling);
          placeCaret(np, false);
        }
        return;
      }
      const ins = le + 1;
      if(isLi){
        const marker = nextMarker();
        spliceSource(ins, ins - 1, [marker], null);
        const span = synthBlock('span', ins, ins, 'itx');
        const li = el.closest('li');
        const nli = document.createElement('li');
        nli.appendChild(span);
        li.parentNode.insertBefore(nli, li.nextSibling);
        placeCaret(span, false);
      } else {
        spliceSource(ins, ins - 1, [p.quote.replace(/[ \t]+$/, '')], null);
        const np = synthBlock('p', ins + 1, ins);
        el.parentNode.insertBefore(np, el.nextSibling);
        placeCaret(np, false);
      }
      return;
    }

    // --- caret at the start or in the middle: rewrite the source and re-render
    let nl;
    if(parts.before === '' && !isLi){
      nl = [p.quote.replace(/[ \t]+$/, ''), p.pfx + parts.after];
    } else if(isLi){
      nl = [p.pfx + parts.before, nextMarker() + parts.after];
    } else if(kind === 'h'){
      nl = [p.pfx + parts.before, p.quote.replace(/[ \t]+$/, ''), p.quote + parts.after];
    } else {
      nl = [p.pfx + parts.before, p.quote.replace(/[ \t]+$/, ''), p.pfx + parts.after];
    }
    nl = nl.map(trimKeepBreak);
    spliceSource(ls, le, nl, null, true);
    pending = { ln: ls + nl.length - 1 };
    renderNow();
  }

  // a block that exists in the DOM before it exists in the file
  // (data-le < data-ls marks "insert at data-ls" — commit() handles that)
  function synthBlock(tagName, ls, le, cls){
    const el = document.createElement(tagName);
    el.dataset.ls = ls; el.dataset.le = le;
    el.className = 'ed' + (cls ? ' ' + cls : '');
    el.setAttribute('contenteditable', 'true');
    return el;
  }

  function onBackspace(el, e){
    const tag = el.tagName.toLowerCase();
    if(tag === 'td' || tag === 'th' || tag === 'code') return;
    if(el.textContent.replace(/ /g, ' ').trim() !== '') return;
    const ls = +el.dataset.ls, le = +el.dataset.le;
    if(!isFinite(ls)) return;
    e.preventDefault(); flushCommit();
    const lines = srcLines();
    lines.splice(ls, Math.max(1, le - ls + 1));
    applyLines(lines);
    pending = { ln: Math.max(0, ls - 1), end: true };
    renderNow();
  }

  function moveCell(el, dir){
    const table = el.closest('table'); if(!table) return;
    const rows = Array.from(table.querySelectorAll('tr'));
    const row = el.parentElement;
    const ri = rows.indexOf(row), ci = Array.from(row.children).indexOf(el);
    let target = null;
    if(dir === 'next'){
      target = row.children[ci + 1] || (rows[ri + 1] && rows[ri + 1].children[0]);
      if(!target) return tableOp('rowBelow', el);
    } else if(dir === 'prev'){
      target = row.children[ci - 1] ||
               (rows[ri - 1] && rows[ri - 1].children[rows[ri - 1].children.length - 1]);
    } else if(dir === 'down'){
      target = rows[ri + 1] && rows[ri + 1].children[ci];
      if(!target) return tableOp('rowBelow', el);
    } else if(dir === 'up'){
      target = rows[ri - 1] && rows[ri - 1].children[ci];
    }
    if(target) placeCaret(target, true);
  }

  function tableOp(op, cellArg){
    const cell = cellArg || lastCell;
    if(!cell || !cell.isConnected) return;
    const table = cell.closest('table');
    const ls = +table.dataset.ls, le = +table.dataset.le;
    if(!isFinite(ls) || !isFinite(le)) return;
    flushCommit(); commitCell(cell);
    const lines = srcLines();
    const rows = [];
    for(let k = ls; k <= le; k++) rows.push(rowParts(lines[k]));
    if(rows.length < 2) return;
    const lead = rows[0].lead;
    const ri = (+cell.dataset.ls) - ls;
    const ci = +cell.dataset.ci;
    const n = Math.max.apply(null, rows.map(r => r.cells.length));
    const blank = () => { const a = []; for(let k = 0; k < n; k++) a.push('   '); return a; };
    let fLn = +cell.dataset.ls, fCi = ci, at;

    switch(op){
      case 'rowAbove':
        at = Math.max(2, ri);
        rows.splice(at, 0, { lead, open:true, close:true, cells: blank() });
        fLn = ls + at; break;
      case 'rowBelow':
        at = Math.max(2, ri + 1);
        rows.splice(at, 0, { lead, open:true, close:true, cells: blank() });
        fLn = ls + at; break;
      case 'rowDel':
        if(ri < 2){ toast('Header rows can’t be deleted'); return; }
        if(rows.length <= 3){ toast('A table needs at least one body row'); return; }
        rows.splice(ri, 1);
        fLn = ls + Math.min(ri, rows.length - 1); break;
      case 'colLeft':
        rows.forEach((r, k) => r.cells.splice(ci, 0, k === 1 ? ' --- ' : '   '));
        fCi = ci; break;
      case 'colRight':
        rows.forEach((r, k) => r.cells.splice(ci + 1, 0, k === 1 ? ' --- ' : '   '));
        fCi = ci + 1; break;
      case 'colDel':
        if(n <= 1){ toast('A table needs at least one column'); return; }
        rows.forEach(r => r.cells.splice(ci, 1));
        fCi = Math.max(0, ci - 1); break;
      case 'alignL': case 'alignC': case 'alignR': {
        const bare = rows[1].cells[ci].trim().replace(/:/g, '') || '---';
        rows[1].cells[ci] = op === 'alignL' ? ' :' + bare + ' '
                          : op === 'alignC' ? ' :' + bare + ': '
                          : ' ' + bare + ': ';
        break;
      }
      default: return;
    }
    spliceSource(ls, le, fmtTable(rows, lead), null, true);
    pending = { ln: fLn, ci: fCi };
    renderNow();
  }

  /* ---------- inline formatting ---------- */
  function hostOf(node){
    const el = node && (node.nodeType === 1 ? node : node.parentElement);
    return el ? el.closest('.ed') : null;
  }
  function wrapInline(tagName){
    const sel = window.getSelection();
    if(!sel.rangeCount || sel.isCollapsed) return;
    const host = hostOf(sel.anchorNode); if(!host) return;
    const r = sel.getRangeAt(0);
    const el = document.createElement(tagName);
    try { r.surroundContents(el); }
    catch(err){ el.appendChild(r.extractContents()); r.insertNode(el); }
    const nr = document.createRange(); nr.selectNodeContents(el);
    sel.removeAllRanges(); sel.addRange(nr);
    queueCommit(host, 0);
  }
  function makeLink(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return;
    const host = hostOf(sel.anchorNode); if(!host) return;
    if(sel.isCollapsed){ toast('Select the text to link first'); return; }
    const url = window.prompt('Link URL', 'https://');
    if(!url) return;
    document.execCommand('createLink', false, url);
    queueCommit(host, 0);
  }

  /* ---------- table toolbar ---------- */
  function updateTblBar(){
    const bar = $('tblBar');
    if(!state.edit || !lastCell || !lastCell.isConnected){ bar.classList.remove('on'); return; }
    const table = lastCell.closest('table');
    if(!table){ bar.classList.remove('on'); return; }
    bar.classList.add('on');
    const rp = $('rightPane').getBoundingClientRect();
    const tb = table.getBoundingClientRect();
    if(tb.bottom < rp.top || tb.top > rp.bottom){ bar.classList.remove('on'); return; }
    const top = tb.top - rp.top - bar.offsetHeight - 8;
    bar.style.top = Math.max(34, top) + 'px';
    bar.style.left = Math.max(6, Math.min(tb.left - rp.left, rp.width - bar.offsetWidth - 10)) + 'px';
  }
  $('tblBar').addEventListener('mousedown', e => e.preventDefault());
  $('tblBar').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    tableOp(b.dataset.op);
  });
  prevScroll.addEventListener('scroll', updateTblBar, { passive:true });

  /* ---------- wiring ---------- */
  function applyEditMode(){
    document.body.classList.toggle('edit', state.edit);
    preview.querySelectorAll('.ed').forEach(el => {
      el.removeAttribute('contenteditable'); el.classList.remove('ed');
    });
    preview.querySelectorAll('li.task input').forEach(cb => { cb.disabled = !state.edit; });
    if(!state.edit){ lastCell = null; updateTblBar(); return; }
    preview.querySelectorAll(EDITABLE).forEach(el => {
      el.setAttribute('contenteditable', 'true');
      el.classList.add('ed');
      if(el.tagName === 'CODE') el.spellcheck = false;
    });
    updateTblBar();
  }

  preview.addEventListener('input', e => {
    if(!state.edit) return;
    const el = hostOf(e.target); if(!el) return;
    queueCommit(el);
  });
  preview.addEventListener('focusout', e => {
    if(!state.edit) return;
    const el = e.target && e.target.classList && e.target.classList.contains('ed') ? e.target : hostOf(e.target);
    if(el){ flushCommit(); commit(el); }
  });
  preview.addEventListener('focusin', e => {
    if(!state.edit) return;
    const c = e.target.closest ? e.target.closest('td.ed, th.ed') : null;
    lastCell = c;
    updateTblBar();
  });
  preview.addEventListener('paste', e => {
    if(!state.edit) return;
    const el = hostOf(e.target); if(!el) return;
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false,
      el.tagName === 'CODE' ? txt : txt.replace(/\s*\n\s*/g, ' '));
  });
  preview.addEventListener('change', e => {
    const cb = e.target;
    if(!state.edit || !cb.matches || !cb.matches('li.task input')) return;
    const ln = +cb.dataset.tls;
    const lines = srcLines();
    if(!isFinite(ln) || ln < 0 || lines[ln] == null) return;
    lines[ln] = lines[ln].replace(/\[[ xX]\]/, cb.checked ? '[x]' : '[ ]');
    applyLines(lines);
  });
  preview.addEventListener('keydown', e => {
    if(!state.edit) return;
    const el = hostOf(e.target); if(!el) return;
    const tag = el.tagName.toLowerCase();
    const mod = e.ctrlKey || e.metaKey;
    if(mod && !e.altKey){
      const k = e.key.toLowerCase();
      if(k === 'b'){ e.preventDefault(); document.execCommand('bold'); return; }
      if(k === 'i'){ e.preventDefault(); document.execCommand('italic'); return; }
      if(k === 'e'){ e.preventDefault(); wrapInline('code'); return; }
      if(k === 'k'){ e.preventDefault(); makeLink(); return; }
      return;
    }
    if(e.key === 'Tab' && (tag === 'td' || tag === 'th')){
      e.preventDefault(); flushCommit(); commitCell(el);
      moveCell(el, e.shiftKey ? 'prev' : 'next'); return;
    }
    if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (tag === 'td' || tag === 'th')){
      e.preventDefault(); flushCommit(); commitCell(el);
      moveCell(el, e.key === 'ArrowDown' ? 'down' : 'up'); return;
    }
    if(e.key === 'Enter'){
      if(e.shiftKey){
        if(tag !== 'code'){ e.preventDefault(); document.execCommand('insertLineBreak'); }
        return;
      }
      onEnter(el, e); return;
    }
    if(e.key === 'Backspace'){ onBackspace(el, e); return; }
  });

  $('bEdit').onclick = () => {
    state.edit = !state.edit;
    $('bEdit').classList.toggle('on', state.edit);
    LS.set('edit', state.edit);
    applyEditMode();
    toast(state.edit ? 'Preview editing on' : 'Preview editing off');
  };
  try { document.execCommand('styleWithCSS', false, false); } catch(e){}

  /* ---------- boot ---------- */
  const SAMPLE = [
    '---',
    'title: Markdown Reader',
    'author: you',
    '---',
    '',
    '# Markdown Reader',
    '',
    'Open a `.md` file with **Open**, or just drag one onto this window. Everything runs',
    'locally in this one file — no server, no dependencies.',
    '',
    '## Two ways to edit',
    '',
    'Type in the **left** pane to write markdown by hand. Or click straight into the',
    '**right** pane and edit it like a document — headings, paragraphs, list items, table',
    'cells and code blocks are all live. Whatever you change there is written back into the',
    'markdown source, touching only the lines you actually edited.',
    '',
    '> [!TIP]',
    '> Click any cell below and type. Put the caret in a table and a toolbar appears for',
    '> adding or deleting rows and columns and setting column alignment. `Tab` moves to',
    '> the next cell, `Enter` moves down.',
    '',
    '## What it handles',
    '',
    '| Feature | Syntax | Notes |',
    '|---|:--|--:|',
    '| Headings | `# … ######` | ATX + setext, auto anchors |',
    '| Emphasis | `**bold**`, `*italic*`, `~~strike~~`, `==mark==` | nesting works |',
    '| Tables | `\\| a \\| b \\|` | alignment row supported |',
    '| Footnotes | `[^1]` | collected at the bottom[^1] |',
    '| Task lists | `- [x] done` | see below |',
    '',
    '- [x] Split view with synced scrolling',
    '- [x] Syntax-highlighted code blocks',
    '- [x] Editing from either side',
    '- [ ] Anything else you want added',
    '  - nested items work too',
    '',
    'Tick a box above and watch the `[ ]` on the left flip to `[x]`.',
    '',
    '> [!NOTE]',
    '> Blockquote callouts (`NOTE`, `TIP`, `WARNING`, `CAUTION`) get styled automatically.',
    '',
    '## Code',
    '',
    '```python',
    'def fib(n: int) -> list[int]:',
    '    """First n Fibonacci numbers."""',
    '    a, b, out = 0, 1, []',
    '    for _ in range(n):',
    '        out.append(a)',
    '        a, b = b, a + b',
    '    return out  # 0, 1, 1, 2, 3, 5 …',
    '```',
    '',
    '```sql',
    'SELECT user_id, COUNT(*) AS n',
    'FROM events WHERE created_at > NOW() - INTERVAL \'7 days\'',
    'GROUP BY 1 ORDER BY n DESC LIMIT 10;',
    '```',
    '',
    '## Shortcuts',
    '',
    '`Ctrl+O` open · `Ctrl+S` save · `Ctrl+B` bold · `Ctrl+I` italic · `Ctrl+E` code ·',
    '`Ctrl+K` link · `Ctrl+\\` toggle preview. They work in both panes. In the preview,',
    '`Shift+Enter` makes a hard line break and `Ctrl+click` follows a link.',
    '',
    '[^1]: Footnotes link both ways — click the arrow to jump back.'
  ].join('\n');

  // restore preferences
  state.theme    = LS.get('theme', state.theme);
  state.sync     = LS.get('sync', true);
  state.wrap     = LS.get('wrap', false);
  state.hlSrc    = LS.get('hlSrc', true);
  state.allowHtml= LS.get('allowHtml', false);
  state.edit     = LS.get('edit', true);
  setTheme(state.theme);
  $('bEdit').classList.toggle('on', state.edit);
  $('bSync').classList.toggle('on', state.sync);
  $('bWrap').classList.toggle('on', state.wrap);
  $('bHl').classList.toggle('on', state.hlSrc);
  $('bHtml').classList.toggle('on', state.allowHtml);
  document.body.classList.toggle('wrap', state.wrap);
  document.body.classList.toggle('nohl', !state.hlSrc);
  editor.setAttribute('wrap', state.wrap ? 'soft' : 'off');
  const sp = LS.get('split', 50); $('leftPane').style.flexBasis = sp + '%';
  setView(LS.get('view', 'split'));

  const saved = LS.get('doc', '');
  loadText(saved && saved.trim() ? saved : SAMPLE, LS.get('docName', 'untitled.md'));
  setDirty(false);
  editor.focus();
})();
</script>
</body>
