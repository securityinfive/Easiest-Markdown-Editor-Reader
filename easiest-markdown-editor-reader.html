<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Reader</title>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ed-size: 13px;
  --ed-line: 20px;
}
html[data-theme="dark"]{
  --bg:#0d1117; --bg-alt:#161b22; --bg-elev:#1c2128; --panel:#0d1117;
  --fg:#e6edf3; --fg-dim:#9198a1; --fg-faint:#6e7681;
  --border:#30363d; --border-soft:#21262d;
  --accent:#4493f8; --accent-soft:#1f6feb33;
  --code-bg:#161b22; --quote-bar:#3d444d; --mark:#bb800955;
  --sel:#264f78aa; --danger:#f85149; --ok:#3fb950; --warn:#d29922;
  --shadow:0 8px 24px rgba(1,4,9,.6);
  --t-com:#8b949e; --t-str:#a5d6ff; --t-num:#79c0ff; --t-kw:#ff7b72;
  --t-fn:#d2a8ff; --t-typ:#ffa657; --t-op:#ff7b72; --t-punc:#c9d1d9;
  --t-attr:#7ee787; --t-tag:#7ee787; --t-var:#ffa657; --t-meta:#8b949e;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg-alt:#f6f8fa; --bg-elev:#ffffff; --panel:#ffffff;
  --fg:#1f2328; --fg-dim:#59636e; --fg-faint:#818b98;
  --border:#d1d9e0; --border-soft:#e4e8ed;
  --accent:#0969da; --accent-soft:#0969da1a;
  --code-bg:#f6f8fa; --quote-bar:#d1d9e0; --mark:#fff8c5;
  --sel:#add6ff88; --danger:#cf222e; --ok:#1a7f37; --warn:#9a6700;
  --shadow:0 8px 24px rgba(31,35,40,.15);
  --t-com:#59636e; --t-str:#0a3069; --t-num:#0550ae; --t-kw:#cf222e;
  --t-fn:#8250df; --t-typ:#953800; --t-op:#cf222e; --t-punc:#1f2328;
  --t-attr:#116329; --t-tag:#116329; --t-var:#953800; --t-meta:#59636e;
}

/* ============================================================
   SHELL
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-ui);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Toolbar */
#bar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:7px 10px; background:var(--bg-alt);
  border-bottom:1px solid var(--border); user-select:none;
}
#bar .brand{
  font-weight:650; font-size:13px; letter-spacing:.2px; margin-right:6px;
  display:flex; align-items:center; gap:7px; color:var(--fg);
}
#bar .brand svg{width:16px;height:16px;fill:var(--accent)}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.spacer{flex:1}
button.btn,label.btn,select.btn{
  font:inherit; font-size:12px; line-height:1;
  background:var(--bg-elev); color:var(--fg);
  border:1px solid var(--border); border-radius:6px;
  padding:6px 9px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  transition:background .12s, border-color .12s;
}
button.btn:hover,label.btn:hover,select.btn:hover{background:var(--bg-alt);border-color:var(--fg-faint)}
button.btn:active{transform:translateY(1px)}
button.btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{filter:brightness(1.1)}
button.btn svg{width:13px;height:13px;fill:currentColor}
select.btn{padding:5px 6px}
#fname{
  font-size:12px; color:var(--fg-dim); font-family:var(--font-mono);
  max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#fname .dirty{color:var(--warn)}

/* Main split */
#main{flex:1 1 auto; display:flex; min-height:0; position:relative}
#leftPane,#rightPane{min-width:0; display:flex; flex-direction:column; position:relative}
#leftPane{flex:0 0 50%; border-right:1px solid var(--border); background:var(--panel)}
#rightPane{flex:1 1 auto; background:var(--bg)}
body.view-source #rightPane{display:none}
body.view-source #leftPane{flex:1 1 auto;border-right:none}
body.view-source #gutterDrag{display:none}
body.view-preview #leftPane{display:none}
body.view-preview #gutterDrag{display:none}

#gutterDrag{
  flex:0 0 6px; margin-left:-3px; margin-right:-3px; z-index:5;
  cursor:col-resize; background:transparent; position:relative;
}
#gutterDrag:hover::after,#gutterDrag.drag::after{
  content:""; position:absolute; inset:0 2px; background:var(--accent); opacity:.6;
}

.pane-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  font-size:11px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--fg-faint); padding:6px 12px;
  background:var(--bg-alt); border-bottom:1px solid var(--border-soft);
}
.pane-head .mini{
  margin-left:auto; text-transform:none; letter-spacing:0; font-size:11px;
  color:var(--fg-dim); font-family:var(--font-mono);
}

/* ============================================================
   EDITOR (textarea overlaid on highlighted <pre>)
   ============================================================ */
#edWrap{flex:1 1 auto; display:flex; min-height:0; position:relative; overflow:hidden}
#lineNums{
  flex:0 0 auto; width:52px; overflow:hidden; text-align:right;
  padding:12px 8px 40vh 0; background:var(--panel);
  border-right:1px solid var(--border-soft);
  font-family:var(--font-mono); font-size:var(--ed-size); line-height:var(--ed-line);
  color:var(--fg-faint); user-select:none; white-space:pre;
}
body.wrap #lineNums{display:none}
#edStack{flex:1 1 auto; position:relative; min-width:0}
#edHigh,#editor{
  position:absolute; inset:0; margin:0;
  padding:12px 16px 40vh 12px;
  font-family:var(--font-mono); font-size:var(--ed-size); line-height:var(--ed-line);
  white-space:pre; word-wrap:normal; tab-size:4;
  border:0; outline:0;
}
body.wrap #edHigh, body.wrap #editor{white-space:pre-wrap; word-break:break-word}
#edHigh{overflow:hidden; color:var(--fg); background:var(--panel); pointer-events:none; z-index:1}
#editor{
  overflow:auto; z-index:2; resize:none; background:transparent;
  color:transparent; caret-color:var(--accent); display:block;
}
body.nohl #edHigh{display:none}
body.nohl #editor{color:var(--fg)}
#editor::selection{background:var(--sel)}
#editor::-moz-selection{background:var(--sel)}

/* markdown source tokens */
.md-h{color:var(--t-kw);font-weight:700}
.md-fence,.md-code{color:var(--t-str)}
.md-bold{color:var(--fg);font-weight:700}
.md-ital{color:var(--fg-dim);font-style:italic}
.md-link{color:var(--accent)}
.md-url{color:var(--t-num);text-decoration:underline}
.md-list{color:var(--t-typ);font-weight:700}
.md-quote{color:var(--t-com);font-style:italic}
.md-hr{color:var(--t-com)}
.md-html{color:var(--t-tag)}
.md-tbl{color:var(--t-fn)}
.md-strike{color:var(--fg-faint);text-decoration:line-through}
.md-ref{color:var(--t-typ)}

/* ============================================================
   PREVIEW
   ============================================================ */
#prevScroll{flex:1 1 auto; overflow:auto; scroll-behavior:auto}
#preview{
  max-width:900px; margin:0 auto; padding:32px 40px 45vh;
  font-size:15px; line-height:1.65; word-wrap:break-word;
}
body.narrow #preview{max-width:720px}
#preview > *:first-child{margin-top:0}
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{
  margin:1.6em 0 .6em; line-height:1.25; font-weight:650; scroll-margin-top:20px;
}
#preview h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
#preview h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
#preview h3{font-size:1.25em}
#preview h4{font-size:1em}
#preview h5{font-size:.9em}
#preview h6{font-size:.85em;color:var(--fg-dim)}
#preview p{margin:0 0 1em}
#preview a{color:var(--accent);text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview .anchor{
  float:left; margin-left:-.85em; padding-right:.25em; opacity:0;
  color:var(--fg-faint); text-decoration:none; font-weight:400;
}
#preview h1:hover .anchor,#preview h2:hover .anchor,#preview h3:hover .anchor,
#preview h4:hover .anchor,#preview h5:hover .anchor,#preview h6:hover .anchor{opacity:1}
#preview ul,#preview ol{margin:0 0 1em;padding-left:2em}
#preview li{margin:.25em 0}
#preview li>ul,#preview li>ol{margin:.25em 0}
#preview li.task{list-style:none;margin-left:-1.4em}
#preview li.task input{margin-right:.5em;vertical-align:middle}
#preview blockquote{
  margin:0 0 1em; padding:.2em 1em; color:var(--fg-dim);
  border-left:.25em solid var(--quote-bar);
}
#preview blockquote > :last-child{margin-bottom:0}
#preview hr{height:3px;border:0;background:var(--border);margin:1.8em 0}
#preview code{
  font-family:var(--font-mono); font-size:.87em;
  background:var(--code-bg); padding:.2em .4em; border-radius:5px;
  border:1px solid var(--border-soft);
}
#preview pre{
  position:relative; margin:0 0 1em; padding:14px 16px; overflow:auto;
  background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
  font-family:var(--font-mono); font-size:12.5px; line-height:1.55;
}
#preview pre code{background:none;border:0;padding:0;font-size:inherit}
#preview pre .lang{
  position:absolute; top:6px; right:10px; font-size:10px; letter-spacing:.5px;
  text-transform:uppercase; color:var(--fg-faint); pointer-events:none;
}
#preview pre .cpy{
  position:absolute; top:6px; right:8px; opacity:0; transition:opacity .12s;
  font-size:11px; padding:3px 7px; border-radius:5px; cursor:pointer;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--fg-dim);
}
#preview pre:hover .cpy{opacity:1}
#preview pre:hover .lang{opacity:0}
#preview table{border-collapse:collapse; margin:0 0 1em; display:block; overflow:auto; max-width:100%}
#preview th,#preview td{border:1px solid var(--border);padding:6px 13px}
#preview th{background:var(--bg-alt);font-weight:650}
#preview tr:nth-child(2n) td{background:var(--bg-alt)}
#preview img{max-width:100%;border-radius:6px;background:var(--bg-alt)}
#preview kbd{
  font-family:var(--font-mono); font-size:.8em; padding:2px 6px; border-radius:5px;
  background:var(--bg-elev); border:1px solid var(--border); border-bottom-width:2px;
}
#preview mark{background:var(--mark);color:inherit;padding:.1em .2em;border-radius:3px}
#preview del{color:var(--fg-dim)}
#preview .fm{
  margin:0 0 1.5em; padding:10px 14px; border:1px dashed var(--border);
  border-radius:8px; background:var(--bg-alt); font-size:12.5px;
  font-family:var(--font-mono); color:var(--fg-dim);
}
#preview .fm b{color:var(--fg)}
#preview .cb{
  margin:0 0 1em; padding:.6em 1em; border-left:.25em solid var(--accent);
  background:var(--accent-soft); border-radius:0 6px 6px 0;
}
#preview .cb .cb-t{font-weight:650;color:var(--accent);margin-bottom:.3em;display:flex;gap:.4em;align-items:center}
#preview .cb.tip{border-color:var(--ok)} #preview .cb.tip .cb-t{color:var(--ok)}
#preview .cb.warning{border-color:var(--warn)} #preview .cb.warning .cb-t{color:var(--warn)}
#preview .cb.caution,#preview .cb.danger{border-color:var(--danger)}
#preview .cb.caution .cb-t,#preview .cb.danger .cb-t{color:var(--danger)}
#preview .cb > :last-child{margin-bottom:0}
#preview .footnotes{margin-top:2.5em;padding-top:1em;border-top:1px solid var(--border);font-size:.9em;color:var(--fg-dim)}
#preview sup.fnref a{text-decoration:none;font-size:.85em;padding:0 2px}
#preview .mermaid-box{
  margin:0 0 1em; padding:14px; text-align:center; overflow:auto;
  background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
}
#preview .mermaid-box svg{max-width:100%;height:auto}
#preview .mm-note{font-size:11px;color:var(--fg-faint);margin-top:6px}

/* syntax tokens (preview code) */
.tok-com{color:var(--t-com);font-style:italic}
.tok-str{color:var(--t-str)}
.tok-num{color:var(--t-num)}
.tok-kw{color:var(--t-kw)}
.tok-fn{color:var(--t-fn)}
.tok-typ{color:var(--t-typ)}
.tok-op{color:var(--t-op)}
.tok-punc{color:var(--t-punc)}
.tok-attr{color:var(--t-attr)}
.tok-tag{color:var(--t-tag)}
.tok-var{color:var(--t-var)}
.tok-meta{color:var(--t-meta)}

/* ============================================================
   WYSIWYG EDIT MODE
   ============================================================ */
#edBadge{
  display:none; font-size:10px; letter-spacing:.4px; text-transform:uppercase;
  color:var(--accent); border:1px solid var(--accent); border-radius:10px;
  padding:1px 7px; background:var(--accent-soft);
}
body.edit #edBadge{display:inline-block}
#preview .ed{ border-radius:4px; transition:background .1s, box-shadow .1s; }
#preview .ed:hover{ background:var(--accent-soft); box-shadow:0 0 0 4px var(--accent-soft); }
#preview .ed:focus{
  outline:2px solid var(--accent); outline-offset:3px;
  background:transparent; box-shadow:none;
}
#preview td.ed, #preview th.ed{ border-radius:0 }
#preview td.ed:hover, #preview th.ed:hover{ box-shadow:inset 0 0 0 1px var(--accent) }
#preview td.ed:focus, #preview th.ed:focus{ outline-offset:-2px }
#preview pre[data-code] > code.ed:focus{ outline-offset:6px }
#preview p.ed:empty{ min-height:1.5em }
#preview span.itx.ed:empty{ display:inline-block; min-width:3px; min-height:1.2em; vertical-align:text-bottom }
body.edit #preview li.task input{ cursor:pointer }
body.edit #preview .anchor{ display:none }
body.edit #preview a{ cursor:text }

#tblBar{
  position:absolute; z-index:30; display:none; gap:1px; padding:3px;
  background:var(--bg-elev); border:1px solid var(--border);
  border-radius:8px; box-shadow:var(--shadow); white-space:nowrap;
}
#tblBar.on{display:flex; align-items:center}
#tblBar button{
  font:inherit; font-size:11px; line-height:1; padding:6px 8px; border-radius:5px;
  border:1px solid transparent; background:transparent; color:var(--fg-dim); cursor:pointer;
}
#tblBar button:hover{background:var(--accent-soft); color:var(--accent)}
#tblBar .div{width:1px; align-self:stretch; background:var(--border); margin:3px 4px}

/* ============================================================
   OUTLINE DRAWER
   ============================================================ */
#toc{
  position:absolute; top:0; right:0; bottom:0; width:280px; z-index:20;
  background:var(--bg-elev); border-left:1px solid var(--border);
  box-shadow:var(--shadow); transform:translateX(100%);
  transition:transform .18s ease; overflow:auto; padding:14px 6px 30px;
}
#toc.open{transform:none}
#toc h4{margin:0 10px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-faint)}
#toc a{
  display:block; padding:4px 10px; font-size:12.5px; color:var(--fg-dim);
  text-decoration:none; border-radius:5px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
#toc a:hover{background:var(--bg-alt);color:var(--fg)}
#toc a.l2{padding-left:22px} #toc a.l3{padding-left:34px;font-size:12px}
#toc a.l4{padding-left:46px;font-size:12px} #toc a.l5,#toc a.l6{padding-left:58px;font-size:11.5px}
#toc .empty{padding:8px 10px;color:var(--fg-faint);font-size:12px}

/* drop overlay */
#drop{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
  align-items:center; justify-content:center; pointer-events:none;
}
#drop.on{display:flex}
#drop div{
  border:2px dashed var(--accent); border-radius:14px; padding:36px 56px;
  background:var(--bg-elev); color:var(--fg); font-size:16px; font-weight:600;
}
#toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(140%);
  background:var(--bg-elev); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:9px 16px; font-size:13px; box-shadow:var(--shadow);
  z-index:200; transition:transform .2s ease; pointer-events:none;
}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ============================================================
   PRINT
   ============================================================ */
@media print{
  body{overflow:visible;display:block;background:#fff;color:#000}
  #bar,#leftPane,#gutterDrag,#toc,#drop,#toast,#tblBar,.pane-head{display:none!important}
  #preview .ed{outline:none!important;background:none!important;box-shadow:none!important}
  #main{display:block} #rightPane{display:block}
  #prevScroll{overflow:visible}
  #preview{max-width:none;padding:0;color:#000}
  #preview pre,#preview code{background:#f6f8fa;border-color:#d1d9e0}
  #preview a{color:#0969da}
  #preview h1,#preview h2{border-color:#d1d9e0}
  #preview pre,#preview blockquote,#preview table,#preview img{break-inside:avoid}
  #preview h1,#preview h2,#preview h3{break-after:avoid}
}
@media (max-width:760px){
  #leftPane{flex-basis:100%}
  body:not(.view-source):not(.view-preview) #rightPane{display:none}
  #preview{padding:20px 16px 40vh}
}
</style>
</head>
<body class="view-split">

<div id="bar">
  <span class="brand">
    <svg viewBox="0 0 16 16"><path d="M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.69C0 12.48.52 13 1.15 13h13.69c.64 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3zM9 11H7V8L5.5 9.92 4 8v3H2V5h2l1.5 2L7 5h2v6zm2.99.5L9.5 8H11V5h2v3h1.5l-2.51 3.5z"/></svg>
    Markdown Reader
  </span>

  <button class="btn" id="bOpen" title="Open a .md file (Ctrl+O)">
    <svg viewBox="0 0 16 16"><path d="M1.75 2h3.836a1.75 1.75 0 0 1 1.237.513l1.008 1.008a.25.25 0 0 0 .177.073h6.242c.966 0 1.75.784 1.75 1.75v6.906A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25V3.75C0 2.784.784 2 1.75 2Z"/></svg>
    Open
  </button>
  <input type="file" id="file" accept=".md,.markdown,.mdown,.mkd,.mdx,.txt,text/markdown,text/plain" hidden>
  <button class="btn" id="bNew" title="Start a blank document">New</button>
  <button class="btn" id="bSave" title="Save .md (Ctrl+S)">Save</button>

  <span class="sep"></span>

  <select class="btn" id="selExport" title="Export">
    <option value="">Export…</option>
    <option value="html">Standalone HTML</option>
    <option value="pdf">Print / PDF</option>
    <option value="chtml">Copy rendered HTML</option>
    <option value="ctext">Copy plain text</option>
  </select>

  <span class="sep"></span>

  <button class="btn on" id="bSplit" data-view="split" title="Split view">Split</button>
  <button class="btn" id="bSrc" data-view="source" title="Source only">Source</button>
  <button class="btn" id="bPrev" data-view="preview" title="Preview only">Preview</button>

  <span class="sep"></span>

  <button class="btn on" id="bEdit" title="Type directly in the preview — changes are written back to the markdown">Edit&nbsp;preview</button>
  <button class="btn" id="bToc" title="Outline">Outline</button>
  <button class="btn on" id="bSync" title="Sync scrolling between panes">Sync</button>
  <button class="btn" id="bWrap" title="Word wrap in the editor">Wrap</button>
  <button class="btn on" id="bHl" title="Highlight markdown source">Hi-Src</button>
  <button class="btn" id="bHtml" title="Render raw HTML found in the markdown (off = shown as text)">Raw&nbsp;HTML</button>
  <button class="btn" id="bTheme" title="Toggle light / dark">Light</button>

  <span class="spacer"></span>
  <span id="fname">untitled.md</span>
</div>

<div id="main">
  <div id="leftPane">
    <div class="pane-head">Source <span class="mini" id="stats"></span></div>
    <div id="edWrap">
      <div id="lineNums">1</div>
      <div id="edStack">
        <pre id="edHigh" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off"></textarea>
      </div>
    </div>
  </div>

  <div id="gutterDrag"></div>

  <div id="rightPane">
    <div class="pane-head">Preview <span id="edBadge">editable</span> <span class="mini" id="rstats"></span></div>
    <div id="prevScroll"><article id="preview"></article></div>
    <div id="tblBar">
      <button data-op="rowAbove" title="Insert row above">&#8593;Row</button>
      <button data-op="rowBelow" title="Insert row below">&#8595;Row</button>
      <button data-op="rowDel" title="Delete this row">&#10005;Row</button>
      <span class="div"></span>
      <button data-op="colLeft" title="Insert column left">&#8592;Col</button>
      <button data-op="colRight" title="Insert column right">&#8594;Col</button>
      <button data-op="colDel" title="Delete this column">&#10005;Col</button>
      <span class="div"></span>
      <button data-op="alignL" title="Align column left">&#8676;</button>
      <button data-op="alignC" title="Center column">&#8703;</button>
      <button data-op="alignR" title="Align column right">&#8677;</button>
    </div>
    <nav id="toc"><h4>Outline</h4><div id="tocList"></div></nav>
  </div>
</div>

<div id="drop"><div>Drop a .md file to open</div></div>
<div id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   1. MARKDOWN PARSER  (CommonMark subset + GFM extensions, dependency-free)
   ========================================================================== */
const MD = (function(){

  const ESC_RE = /[&<>"']/g;
  const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  function esc(s){ return String(s).replace(ESC_RE, c => ESC_MAP[c]); }

  // Placeholder store keeps generated HTML safe from later regex passes.
  let store = [];
  const PH_OPEN = '\uE000', PH_CLOSE = '\uE001';
  function keep(html){ store.push(html); return PH_OPEN + (store.length - 1) + PH_CLOSE; }
  function restore(s){
    let prev;
    do { prev = s; s = s.replace(/\uE000(\d+)\uE001/g, (_, i) => store[+i]); }
    while (s !== prev && /\uE000\d+\uE001/.test(s));
    return s;
  }

  function safeUrl(u){
    const t = String(u).trim().replace(/&amp;/g,'&');
    if(/^\s*(javascript|vbscript|file):/i.test(t)) return '#';
    return t.replace(/"/g,'%22').replace(/&/g,'&amp;');
  }

  let refs = {};        // reference-style link definitions
  let footnotes = [];   // {label, html}
  let fnOrder = [];     // order of first reference
  let headings = [];    // {level, text, id, line}
  let usedIds = {};
  let OPT = { allowHtml:false, highlight:null };

  function slug(text){
    let s = text.toLowerCase().replace(/<[^>]*>/g,'')
      .replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-');
    if(!s) s = 'section';
    if(usedIds[s] == null){ usedIds[s] = 0; return s; }
    usedIds[s]++; return s + '-' + usedIds[s];
  }

  /* ---------------------------- INLINE ---------------------------------- */
  function cleanTitle(r){
    let t = (r || '').trim();
    if(!t) return '';
    t = t.replace(/^(?:&quot;|&#39;|["'(])/, '').replace(/(?:&quot;|&#39;|["')])$/, '');
    return t.trim().replace(/"/g, '&quot;');
  }

  function emphasis(s){
    // code-like protections already applied by caller
    s = s.replace(/(\*\*\*|___)(?=\S)([\s\S]*?\S)\1/g, '<strong><em>$2</em></strong>');
    s = s.replace(/(\*\*)(?=\S)([\s\S]*?\S)\1/g, '<strong>$2</strong>');
    s = s.replace(/(?<![\w\\])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*(?!\s|\*)([^*]*?[^\s*]|[^\s*])\*(?!\*)/g, '<em>$1</em>');
    s = s.replace(/(?<![\w\\])_(?=\S)([^_]*?\S)_(?!\w)/g, '<em>$1</em>');
    s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
    s = s.replace(/(?<!=)==(?=\S)([\s\S]*?\S)==(?!=)/g, '<mark>$1</mark>');
    s = s.replace(/(?<![\w\\])\^([^\s^]+)\^/g, '<sup>$1</sup>');
    return s;
  }

  function inline(src){
    let s = src;

    // raw HTML (opt-in) is protected before escaping
    if(OPT.allowHtml){
      s = s.replace(/<\/?[A-Za-z][A-Za-z0-9-]*(?:\s[^<>]*?)?\/?>/g, m => keep(m));
      s = s.replace(/<!--[\s\S]*?-->/g, m => keep(m));
    }
    s = esc(s);

    // 1. inline code spans (longest fences first)
    s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (m, f, code) => {
      let c = code;
      if(/^ .* $/.test(c) && /\S/.test(c)) c = c.slice(1, -1);
      return keep('<code>' + c + '</code>');
    });
    // 1b. backslash escapes (not applied inside code spans, which are already stored)
    s = s.replace(/\\(&(?:quot|#39|amp|lt|gt);)/g, (m, c) => keep(c));
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!>~^=|$@:;,/'"])/g, (m, c) => keep(esc(c)));

    // 2. images  ![alt](src "title")
    s = s.replace(/!\[([^\]]*)\]\(\s*<?([^\s)>]*)>?((?:\s+[^)]*?)?)\s*\)/g,
      (m, alt, src, rest) => {
        const title = cleanTitle(rest);
        return keep('<img src="' + safeUrl(src) + '" alt="' + alt + '"' + (title ? ' title="' + title + '"' : '') + '>');
      });
    // reference images ![alt][ref]
    s = s.replace(/!\[([^\]]*)\]\[([^\]]*)\]/g, (m, alt, id) => {
      const r = refs[(id || alt).toLowerCase()];
      return r ? keep('<img src="' + safeUrl(r.url) + '" alt="' + alt + '"' + (r.title ? ' title="' + r.title + '"' : '') + '>') : m;
    });

    // 3. footnote references [^id]
    s = s.replace(/\[\^([^\]\s]+)\]/g, (m, id) => {
      const key = id.toLowerCase();
      if(!fnOrder.includes(key)) fnOrder.push(key);
      const n = fnOrder.indexOf(key) + 1;
      return keep('<sup class="fnref" id="fnref-' + esc(key) + '"><a href="#fn-' + esc(key) + '">[' + n + ']</a></sup>');
    });

    // 4. inline links [text](url "title")
    s = s.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\(\s*<?([^\s)>]*)>?((?:\s+[^)]*?)?)\s*\)/g,
      (m, text, url, rest) => {
        const title = cleanTitle(rest);
        return keep('<a href="' + safeUrl(url) + '"' + (title ? ' title="' + title + '"' : '') +
          (/^[a-z][a-z0-9+.-]*:\/\//i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '') +
          '>' + emphasis(text) + '</a>');
      });
    // reference links [text][id] and [id]
    s = s.replace(/\[((?:[^\[\]])*)\]\[([^\]]*)\]/g, (m, text, id) => {
      const r = refs[(id || text).toLowerCase()];
      return r ? keep('<a href="' + safeUrl(r.url) + '"' + (r.title ? ' title="' + r.title + '"' : '') + ' target="_blank" rel="noopener noreferrer">' + emphasis(text) + '</a>') : m;
    });
    s = s.replace(/\[([^\[\]]+)\](?!\()/g, (m, text) => {
      const r = refs[text.toLowerCase()];
      return r ? keep('<a href="' + safeUrl(r.url) + '" target="_blank" rel="noopener noreferrer">' + emphasis(text) + '</a>') : m;
    });

    // 5. autolinks <https://..>, <mail@x>, and bare URLs
    s = s.replace(/&lt;((?:https?|ftp):\/\/[^\s&]+)&gt;/g,
      (m, u) => keep('<a href="' + safeUrl(u) + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'));
    s = s.replace(/&lt;([^\s@&]+@[^\s@&]+\.[^\s@&]+)&gt;/g,
      (m, e) => keep('<a href="mailto:' + e + '">' + e + '</a>'));
    s = s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>()\[\]]*[^\s<>()\[\].,;:!?'"])/g,
      (m, pre, u) => pre + keep('<a href="' + safeUrl(u.indexOf('www.') === 0 ? 'https://' + u : u) + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'));

    // 6. emphasis and friends
    s = emphasis(s);

    // 7. hard line breaks
    s = s.replace(/(  +|\\)\n/g, '<br>\n');

    return restore(s);
  }

  /* ---------------------------- BLOCKS ---------------------------------- */
  const RE = {
    fence:    /^( {0,3})(`{3,}|~{3,})[ \t]*([^`\n]*)$/,
    atx:      /^( {0,3})(#{1,6})(?:[ \t]+(.*?))?[ \t]*#*[ \t]*$/,
    hr:       /^ {0,3}((?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/,
    quote:    /^ {0,3}>[ ]?/,
    ul:       /^( {0,7})([-*+])([ \t]+)(.*)$/,
    ol:       /^( {0,7})(\d{1,9})([.)])([ \t]+)(.*)$/,
    tblSep:   /^[ \t]*\|?[ \t]*:?-{1,}:?[ \t]*(\|[ \t]*:?-{1,}:?[ \t]*)*\|?[ \t]*$/,
    setext:   /^ {0,3}(=+|-+)[ \t]*$/,
    htmlOpen: /^ {0,3}<(?:\/?[A-Za-z][A-Za-z0-9-]*|!--)/,
    fndef:    /^ {0,3}\[\^([^\]\s]+)\]:[ \t]*(.*)$/,
    refdef:   /^ {0,3}\[([^\^\]]+)\]:[ \t]*<?([^\s>]+)>?(?:[ \t]+["'(](.*)["')])?[ \t]*$/,
    blank:    /^[ \t]*$/
  };

  function isBlockStart(l){
    return RE.blank.test(l) || RE.fence.test(l) || RE.atx.test(l) || RE.hr.test(l) ||
           RE.quote.test(l) || RE.ul.test(l) || RE.ol.test(l) ||
           (OPT.allowHtml && RE.htmlOpen.test(l));
  }

  function parseBlocks(lines, top, map){
    if(!map) map = lines.map((_, k) => k);
    // source range of local lines [a..b] as data attributes
    const rng = (a, b) => {
      let s = -1, e = -1;
      for(let k = a; k <= b && k < map.length; k++){
        const o = map[k];
        if(o != null && o >= 0){ if(s < 0) s = o; e = o; }
      }
      return s < 0 ? '' : ' data-ls="' + s + '" data-le="' + e + '"';
    };
    let out = [], i = 0;

    while(i < lines.length){
      let line = lines[i];
      const st = i;

      if(RE.blank.test(line)){ i++; continue; }

      // ---- fenced code
      let m = line.match(RE.fence);
      if(m){
        const marker = m[2][0], len = m[2].length, indent = m[1].length;
        const info = (m[3] || '').trim();
        const lang = info.split(/\s+/)[0].replace(/[{}.,]/g,'');
        let buf = []; i++;
        const cs = i; let ce = i - 1;
        while(i < lines.length){
          const c = lines[i];
          const cm = c.match(/^( {0,3})(`{3,}|~{3,})[ \t]*$/);
          if(cm && cm[2][0] === marker && cm[2].length >= len){ i++; break; }
          buf.push(c.slice(0, indent).trim() === '' ? c.slice(indent) : c);
          ce = i; i++;
        }
        let at = buf.length ? rng(cs, ce) : '';
        if(!at){ // empty body: remember the insertion point (le < ls)
          const after = (map[st] != null && map[st] >= 0) ? map[st] + 1 : -1;
          if(after >= 0) at = ' data-ls="' + after + '" data-le="' + (after - 1) + '"';
        }
        const code = buf.join('\n');
        if(/^mermaid$/i.test(lang)){
          out.push('<div class="mermaid-box"' + at + ' data-mermaid="' + esc(code) + '"><pre><code>' + esc(code) + '</code></pre></div>');
        } else {
          const body = OPT.highlight ? OPT.highlight(code, lang) : esc(code);
          out.push('<pre data-lang="' + esc(lang) + '" data-code="1"' + at + '><span class="lang">' + esc(lang || 'text') +
                   '</span><button class="cpy" type="button">Copy</button><code class="language-' + esc(lang) + '">' + body + '</code></pre>');
        }
        continue;
      }

      // ---- ATX heading
      m = line.match(RE.atx);
      if(m){
        const lvl = m[2].length;
        const raw = (m[3] || '').trim();
        const html = inline(raw);
        const id = slug(raw || 'heading');
        if(top) headings.push({ level:lvl, text:raw.replace(/<[^>]*>/g,''), id });
        out.push('<h' + lvl + ' id="' + id + '"' + rng(st, st) + '><a class="anchor" href="#' + id + '" aria-hidden="true">#</a>' + html + '</h' + lvl + '>');
        i++; continue;
      }

      // ---- thematic break
      if(RE.hr.test(line)){ out.push('<hr' + rng(st, st) + '>'); i++; continue; }

      // ---- blockquote (with GFM callouts)
      if(RE.quote.test(line)){
        let buf = [], bmap = [];
        while(i < lines.length && (RE.quote.test(lines[i]) ||
              (!RE.blank.test(lines[i]) && buf.length && !isBlockStart(lines[i])))){
          buf.push(lines[i].replace(RE.quote, '')); bmap.push(map[i]);
          i++;
        }
        const cm = buf[0] && buf[0].match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION|DANGER|INFO)\]\s*(.*)$/i);
        if(cm){
          const kind = cm[1].toLowerCase();
          buf[0] = cm[2] || '';
          const inner = parseBlocks(buf, false, bmap);
          const label = cm[1].charAt(0) + cm[1].slice(1).toLowerCase();
          out.push('<div class="cb ' + kind + '"><div class="cb-t">' + esc(label) + '</div>' + inner + '</div>');
        } else {
          out.push('<blockquote>' + parseBlocks(buf, false, bmap) + '</blockquote>');
        }
        continue;
      }

      // ---- lists
      const um = line.match(RE.ul), om = line.match(RE.ol);
      if(um || om){
        const ordered = !!om;
        const start = ordered ? parseInt(om[2], 10) : 1;
        let items = [], loose = false, sawBlank = false;
        const baseIndent = (ordered ? om[1] : um[1]).length;

        while(i < lines.length){
          const l = lines[i];
          if(RE.blank.test(l)){
            // look ahead: blank then continuation?
            let j = i + 1;
            while(j < lines.length && RE.blank.test(lines[j])) j++;
            if(j >= lines.length) { i = j; break; }
            const nxt = lines[j];
            const nu = nxt.match(RE.ul), no = nxt.match(RE.ol);
            const contIndent = /^(\s*)/.exec(nxt)[1].length;
            const nestAt0 = items.length ? Math.min(items[items.length-1].pad, baseIndent + 2) : baseIndent + 2;
            const sameList = (ordered ? no : nu) && contIndent < nestAt0;
            if(sameList || contIndent >= nestAt0){ sawBlank = true; i = j; continue; }
            i = j; break;
          }
          const lu = l.match(RE.ul), lo = l.match(RE.ol);
          const lIndent = /^(\s*)/.exec(l)[1].length;
          const nestAt = items.length ? Math.min(items[items.length-1].pad, baseIndent + 2) : baseIndent + 2;
          const isItem = (ordered ? lo : lu) && lIndent < nestAt;
          const isOtherType = (ordered ? lu : lo) && lIndent < nestAt;

          if(isItem){
            if(sawBlank){ loose = true; sawBlank = false; }
            const marker = ordered ? lo : lu;
            const content = ordered ? marker[5] : marker[4];
            const markLen = ordered ? (marker[1].length + marker[2].length + 1 + marker[3].length)
                                    : (marker[1].length + 1 + marker[3].length);
            items.push({ lines:[content], map:[map[i]], pad:markLen, blank:false });
            i++; continue;
          }
          if(isOtherType) break;         // different list type at same level → new list
          if(items.length === 0) break;
          if(lIndent > baseIndent || /^\s/.test(l)){
            const it = items[items.length - 1];
            const strip = Math.min(it.pad, /^(\s*)/.exec(l)[1].length);
            it.lines.push(l.slice(strip)); it.map.push(map[i]);
            if(sawBlank){
              it.lines.splice(it.lines.length - 1, 0, '');
              it.map.splice(it.map.length - 1, 0, -1);
              loose = true; sawBlank = false;
            }
            i++; continue;
          }
          if(isBlockStart(l)) break;
          // lazy continuation of the paragraph inside the item
          if(!sawBlank){
            const it = items[items.length - 1];
            it.lines.push(l); it.map.push(map[i]); i++; continue;
          }
          break;
        }

        let html = '';
        for(const it of items){
          let body = it.lines.join('\n');
          let cls = '', box = '';
          const tm = body.match(/^\[([ xX])\][ \t]+([\s\S]*)$/);
          if(tm){
            cls = ' class="task"';
            box = '<input type="checkbox" data-tls="' + (it.map[0] != null && it.map[0] >= 0 ? it.map[0] : -1) +
                  '" disabled' + (tm[1].toLowerCase() === 'x' ? ' checked' : '') + '>';
            body = tm[2];
          }
          let inner = parseBlocks(body.split('\n'), false, it.map.slice());
          if(!loose) inner = inner.replace(/^<p([^>]*)>([\s\S]*?)<\/p>\s*/, '<span class="itx"$1>$2</span>');
          html += '<li' + cls + '>' + box + inner + '</li>';
        }
        out.push(ordered
          ? '<ol' + (start !== 1 ? ' start="' + start + '"' : '') + '>' + html + '</ol>'
          : '<ul>' + html + '</ul>');
        continue;
      }

      // ---- tables (GFM)
      if(line.indexOf('|') !== -1 && i + 1 < lines.length && RE.tblSep.test(lines[i+1]) && lines[i+1].indexOf('|') !== -1){
        const splitRow = r => {
          r = r.trim().replace(/^\|/, '').replace(/\|$/, '');
          const cells = []; let cur = '', q = false;
          for(let k = 0; k < r.length; k++){
            const ch = r[k];
            if(ch === '`') q = !q;
            if(ch === '|' && !q && r[k-1] !== '\\'){ cells.push(cur); cur = ''; }
            else cur += ch;
          }
          cells.push(cur);
          return cells.map(c => c.trim().replace(/\\\|/g, '|'));
        };
        const head = splitRow(line);
        const aligns = splitRow(lines[i+1]).map(c => {
          const l = c.charAt(0) === ':', r = c.charAt(c.length-1) === ':';
          return l && r ? 'center' : r ? 'right' : l ? 'left' : '';
        });
        const hLine = map[i], sLine = map[i+1];
        const cellAt = (l, k) => (l != null && l >= 0) ? ' data-ls="' + l + '" data-ci="' + k + '"' : '';
        i += 2;
        let body = '', last = st + 1;
        while(i < lines.length && !RE.blank.test(lines[i]) && lines[i].indexOf('|') !== -1 && !RE.fence.test(lines[i])){
          const cells = splitRow(lines[i]), rl = map[i];
          body += '<tr' + (rl >= 0 ? ' data-ls="' + rl + '"' : '') + '>' + head.map((_, k) =>
            '<td' + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + cellAt(rl, k) + '>' + inline(cells[k] || '') + '</td>'
          ).join('') + '</tr>';
          last = i; i++;
        }
        out.push('<table' + rng(st, last) + (sLine >= 0 ? ' data-sep="' + sLine + '"' : '') +
          '><thead><tr' + (hLine >= 0 ? ' data-ls="' + hLine + '"' : '') + '>' + head.map((h, k) =>
            '<th' + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + cellAt(hLine, k) + '>' + inline(h) + '</th>').join('') +
          '</tr></thead>' + (body ? '<tbody>' + body + '</tbody>' : '') + '</table>');
        continue;
      }

      // ---- indented code block (4 spaces / tab), only if not continuing a paragraph
      if(/^(?: {4}|\t)/.test(line)){
        let buf = [], last = i;
        while(i < lines.length && (/^(?: {4}|\t)/.test(lines[i]) || RE.blank.test(lines[i]))){
          if(RE.blank.test(lines[i])){
            // stop if the blank run ends the block
            let j = i; while(j < lines.length && RE.blank.test(lines[j])) j++;
            if(j >= lines.length || !/^(?: {4}|\t)/.test(lines[j])){ i = j; break; }
            for(let k = i; k < j; k++) buf.push('');
            i = j; continue;
          }
          buf.push(lines[i].replace(/^(?: {4}|\t)/, ''));
          last = i; i++;
        }
        out.push('<pre data-code="1" data-indent="1"' + rng(st, last) + '><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      // ---- raw HTML block
      if(OPT.allowHtml && RE.htmlOpen.test(line)){
        let buf = [];
        while(i < lines.length && !RE.blank.test(lines[i])){ buf.push(lines[i]); i++; }
        out.push(buf.join('\n'));
        continue;
      }

      // ---- paragraph (with setext heading detection)
      let buf = [];
      while(i < lines.length && !RE.blank.test(lines[i])){
        const l = lines[i];
        if(buf.length && RE.setext.test(l)){
          const lvl = l.trim()[0] === '=' ? 1 : 2;
          const raw = buf.join(' ').trim();
          const id = slug(raw);
          if(top) headings.push({ level:lvl, text:raw.replace(/<[^>]*>/g,''), id });
          out.push('<h' + lvl + ' id="' + id + '"' + rng(st, i) + ' data-setext="1"><a class="anchor" href="#' + id + '" aria-hidden="true">#</a>' + inline(raw) + '</h' + lvl + '>');
          buf = null; i++; break;
        }
        if(buf.length && (RE.fence.test(l) || RE.atx.test(l) || RE.hr.test(l) || RE.quote.test(l) ||
                          RE.ul.test(l) || RE.ol.test(l))) break;
        buf.push(l); i++;
      }
      if(buf && buf.length) out.push('<p' + rng(st, i - 1) + '>' + inline(buf.join('\n')) + '</p>');
    }
    return out.join('\n');
  }

  /* ---------------------------- ENTRY ----------------------------------- */
  function render(src, opts){
    OPT = Object.assign({ allowHtml:false, highlight:null }, opts || {});
    store = []; refs = {}; footnotes = []; fnOrder = []; headings = []; usedIds = {};

    let text = String(src).replace(/\r\n?/g, '\n').replace(/\u00a0/g, ' ');
    let pre = '';

    // YAML front matter
    const fm = text.match(/^---[ \t]*\n([\s\S]*?)\n---[ \t]*(?:\n|$)/);
    if(fm){
      const rows = fm[1].split('\n').filter(l => l.trim()).map(l => {
        const k = l.match(/^([^:]{1,60}):\s*(.*)$/);
        return k ? '<b>' + esc(k[1]) + ':</b> ' + esc(k[2]) : esc(l);
      });
      pre = '<div class="fm">' + rows.join('<br>') + '</div>';
      // keep line numbering aligned with the real source by padding with blanks
      const consumed = fm[0].split('\n').length - 1;
      text = '\n'.repeat(consumed) + text.slice(fm[0].length);
    }

    let lines = text.split('\n');

    // pull out link reference definitions + footnote definitions (outside fences)
    const kept = [], keptMap = [];
    let inFence = false, fenceCh = '';
    for(let i = 0; i < lines.length; i++){
      const l = lines[i];
      const f = l.match(/^( {0,3})(`{3,}|~{3,})/);
      if(f){
        if(!inFence){ inFence = true; fenceCh = f[2][0]; }
        else if(f[2][0] === fenceCh){ inFence = false; }
        kept.push(l); keptMap.push(i); continue;
      }
      if(inFence){ kept.push(l); keptMap.push(i); continue; }

      const fn = l.match(RE.fndef);
      if(fn){
        const body = [fn[2]];
        let j = i + 1;
        while(j < lines.length && (/^(?: {2,}|\t)\S/.test(lines[j]) || (RE.blank.test(lines[j]) && /^(?: {2,}|\t)\S/.test(lines[j+1] || '')))){
          body.push(lines[j].replace(/^(?: {1,4}|\t)/, '')); j++;
        }
        footnotes.push({ label: fn[1].toLowerCase(), src: body.join('\n') });
        i = j - 1; continue;
      }
      const rd = l.match(RE.refdef);
      if(rd && !/^\s*\|/.test(l)){ refs[rd[1].toLowerCase()] = { url: rd[2], title: rd[3] || '' }; continue; }
      kept.push(l); keptMap.push(i);
    }

    let html = pre + parseBlocks(kept, true, keptMap);

    // footnote section, ordered by first reference
    if(fnOrder.length){
      const map = {}; footnotes.forEach(f => map[f.label] = f);
      const items = fnOrder.map(lbl => {
        const f = map[lbl];
        const body = f ? parseBlocks(f.src.split('\n'), false, f.src.split('\n').map(() => -1))
                       : '<p><em>missing footnote</em></p>';
        return '<li id="fn-' + esc(lbl) + '">' + body.replace(/<\/p>\s*$/, ' <a href="#fnref-' + esc(lbl) + '">&#8617;</a></p>') + '</li>';
      });
      html += '<section class="footnotes"><ol>' + items.join('') + '</ol></section>';
    }
    return { html, headings };
  }

  return { render, esc };
})();

/* ==========================================================================
   2. SYNTAX HIGHLIGHTER (regex scanner, ~20 languages)
   ========================================================================== */
const HL = (function(){
  const esc = MD.esc;
  const r = (re, cls) => ({ re: new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g'), cls });

  const S_DQ  = /"(?:[^"\\\n]|\\[\s\S])*"?/;
  const S_SQ  = /'(?:[^'\\\n]|\\[\s\S])*'?/;
  const S_BQ  = /`(?:[^`\\]|\\[\s\S])*`?/;
  const C_LN  = /\/\/.*/;
  const C_BL  = /\/\*[\s\S]*?(?:\*\/|$)/;
  const C_HSH = /#.*/;
  const NUM   = /\b(?:0[xXbBoO][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)\b/;
  const FN    = /\b[A-Za-z_$][\w$]*(?=\s*\()/;
  const TYPE  = /\b[A-Z][A-Za-z0-9_]*\b/;
  const OP    = /[+\-*/%=!<>&|^~?:]+/;
  const PUNC  = /[{}()\[\];,.]/;

  const kw = words => new RegExp('\\b(?:' + words.trim().split(/\s+/).join('|') + ')\\b', 'g');

  const JS_KW = kw(`async await break case catch class const continue debugger default delete do else export
    extends finally for from function get if import in instanceof let new of return set static super switch this
    throw try typeof var void while with yield true false null undefined NaN Infinity as satisfies keyof readonly
    interface type enum namespace declare implements private public protected abstract override is`);
  const PY_KW = kw(`False None True and as assert async await break class continue def del elif else except finally
    for from global if import in is lambda nonlocal not or pass raise return try while with yield match case self`);
  const SH_KW = kw(`if then else elif fi for while until do done case esac function return in select time coproc
    echo cd export local source alias sudo set unset trap exit read printf shift eval exec test`);
  const SQL_KW = new RegExp('\\b(?:' + `SELECT FROM WHERE INSERT INTO UPDATE DELETE SET VALUES JOIN LEFT RIGHT INNER OUTER FULL
    CROSS ON GROUP BY ORDER HAVING LIMIT OFFSET UNION ALL DISTINCT AS AND OR NOT NULL IS IN LIKE BETWEEN EXISTS CASE WHEN
    THEN ELSE END CREATE TABLE VIEW INDEX DROP ALTER ADD COLUMN PRIMARY KEY FOREIGN REFERENCES CONSTRAINT UNIQUE DEFAULT
    WITH RETURNING CAST COUNT SUM AVG MIN MAX COALESCE`.trim().split(/\s+/).join('|') + ')\\b', 'gi');
  const GO_KW = kw(`break case chan const continue default defer else fallthrough for func go goto if import interface
    map package range return select struct switch type var nil true false make new len cap append copy delete panic recover
    string int int8 int16 int32 int64 uint uint8 uint16 uint32 uint64 float32 float64 bool byte rune error any`);
  const RS_KW = kw(`as async await break const continue crate dyn else enum extern false fn for if impl in let loop match
    mod move mut pub ref return self Self static struct super trait true type unsafe use where while box`);
  const C_KW = kw(`auto break case char const continue default do double else enum extern float for goto if inline int long
    register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while bool true
    false nullptr class public private protected virtual override template typename namespace using new delete this try catch throw`);
  const JAVA_KW = kw(`abstract assert boolean break byte case catch char class const continue default do double else enum
    extends final finally float for goto if implements import instanceof int interface long native new package private
    protected public return short static strictfp super switch synchronized this throw throws transient try void volatile
    while var record sealed true false null`);
  const PHP_KW = kw(`abstract and array as break callable case catch class clone const continue declare default do echo else
    elseif empty enddeclare endfor endforeach endif endswitch endwhile enum extends final finally fn for foreach function
    global goto if implements include include_once instanceof insteadof interface isset list match namespace new or print
    private protected public readonly require require_once return static switch throw trait try unset use var while xor yield
    true false null`);
  const RB_KW = kw(`alias and begin break case class def defined do else elsif end ensure false for if in module next nil not
    or redo rescue retry return self super then true undef unless until when while yield attr_accessor attr_reader require puts`);

  const LANGS = {
    js: [r(C_BL,'com'), r(C_LN,'com'), r(S_BQ,'str'), r(S_DQ,'str'), r(S_SQ,'str'),
         r(/\/(?![\/*])(?:\[[^\]]*\]|[^\/\\\n])+\/[gimsuy]*/,'str'),
         { re: JS_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    py: [r(/(?:"""|''')[\s\S]*?(?:"""|''')/,'str'), r(C_HSH,'com'),
         r(/[frbu]{0,2}"(?:[^"\\\n]|\\[\s\S])*"?/,'str'), r(/[frbu]{0,2}'(?:[^'\\\n]|\\[\s\S])*'?/,'str'),
         r(/@[\w.]+/,'meta'), { re: PY_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    sh: [r(C_HSH,'com'), r(S_DQ,'str'), r(S_SQ,'str'), r(/\$\{[^}]*\}|\$[\w@#?*!$-]+/,'var'),
         { re: SH_KW, cls:'kw' }, r(/(?:^|\s)--?[\w-]+/,'attr'), r(NUM,'num'), r(OP,'op'), r(PUNC,'punc')],
    json:[r(/"(?:[^"\\]|\\[\s\S])*"(?=\s*:)/,'attr'), r(S_DQ,'str'),
          r(/\b(?:true|false|null)\b/,'kw'), r(NUM,'num'), r(PUNC,'punc')],
    yaml:[r(C_HSH,'com'), r(/^[ \t-]*[\w.$-]+(?=\s*:)/m,'attr'), r(S_DQ,'str'), r(S_SQ,'str'),
          r(/\b(?:true|false|null|yes|no|on|off)\b/,'kw'), r(NUM,'num'), r(/[-:>|]/,'punc')],
    html:[r(/<!--[\s\S]*?-->/,'com'), r(/<!DOCTYPE[^>]*>/i,'meta'),
          r(/<\/?[A-Za-z][\w-]*/,'tag'), r(/[\w-]+(?==)/,'attr'), r(S_DQ,'str'), r(S_SQ,'str'), r(/\/?>/,'tag')],
    css:[r(C_BL,'com'), r(/@[\w-]+/,'kw'), r(/[.#][\w-]+|::?[\w-]+/,'typ'),
         r(/[\w-]+(?=\s*:)/,'attr'), r(S_DQ,'str'), r(S_SQ,'str'),
         r(/#[0-9a-fA-F]{3,8}\b/,'num'), r(/\b\d[\d.]*(?:px|em|rem|%|vh|vw|s|ms|fr|deg|pt)?\b/,'num'), r(PUNC,'punc')],
    sql:[r(/--.*/,'com'), r(C_BL,'com'), r(S_SQ,'str'), r(S_DQ,'attr'),
         { re: SQL_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(OP,'op'), r(PUNC,'punc')],
    go: [r(C_BL,'com'), r(C_LN,'com'), r(S_BQ,'str'), r(S_DQ,'str'), r(S_SQ,'str'),
         { re: GO_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    rust:[r(C_BL,'com'), r(C_LN,'com'), r(S_DQ,'str'), r(/'(?:\\.|[^'\\])'/,'str'),
          r(/#!?\[[^\]]*\]/,'meta'), r(/\b\w+!/,'fn'), { re: RS_KW, cls:'kw' },
          r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    c:  [r(C_BL,'com'), r(C_LN,'com'), r(/^\s*#\s*\w+/m,'meta'), r(S_DQ,'str'), r(S_SQ,'str'),
         { re: C_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    java:[r(C_BL,'com'), r(C_LN,'com'), r(S_DQ,'str'), r(S_SQ,'str'), r(/@\w+/,'meta'),
          { re: JAVA_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    php:[r(C_BL,'com'), r(C_LN,'com'), r(C_HSH,'com'), r(S_DQ,'str'), r(S_SQ,'str'),
         r(/\$\w+/,'var'), r(/<\?php|\?>/,'meta'), { re: PHP_KW, cls:'kw' },
         r(NUM,'num'), r(FN,'fn'), r(TYPE,'typ'), r(OP,'op'), r(PUNC,'punc')],
    ruby:[r(C_HSH,'com'), r(S_DQ,'str'), r(S_SQ,'str'), r(/:[a-zA-Z_]\w*/,'typ'),
          r(/@@?\w+/,'var'), { re: RB_KW, cls:'kw' }, r(NUM,'num'), r(FN,'fn'), r(OP,'op'), r(PUNC,'punc')],
    ini:[r(/[;#].*/,'com'), r(/^\[.*\]$/m,'typ'), r(/^[\w.$-]+(?=\s*=)/m,'attr'), r(S_DQ,'str'), r(NUM,'num')],
    diff:[r(/^\+.*/m,'attr'), r(/^-.*/m,'kw'), r(/^@@.*/m,'fn'), r(/^(?:diff|index|---|\+\+\+).*/m,'com')]
  };

  const ALIAS = {
    javascript:'js', jsx:'js', mjs:'js', cjs:'js', node:'js',
    ts:'js', tsx:'js', typescript:'js',
    python:'py', py3:'py', python3:'py',
    bash:'sh', shell:'sh', zsh:'sh', console:'sh', shellsession:'sh', sh:'sh', ps1:'sh', powershell:'sh',
    yml:'yaml', xml:'html', svg:'html', vue:'html', htm:'html',
    scss:'css', less:'css', sass:'css',
    golang:'go', rs:'rust', 'c++':'c', cpp:'c', cxx:'c', h:'c', hpp:'c', cs:'java', csharp:'java',
    kotlin:'java', kt:'java', scala:'java', swift:'java', dart:'java', groovy:'java',
    rb:'ruby', postgres:'sql', postgresql:'sql', mysql:'sql', sqlite:'sql',
    toml:'ini', conf:'ini', cfg:'ini', dotenv:'ini', env:'ini', properties:'ini',
    patch:'diff', dockerfile:'sh', makefile:'sh', make:'sh', hcl:'ini', terraform:'ini', tf:'ini'
  };

  function highlight(code, lang){
    const key = ALIAS[(lang || '').toLowerCase()] || (lang || '').toLowerCase();
    const rules = LANGS[key];
    if(!rules || code.length > 200000) return esc(code);
    let out = '', pos = 0, guard = 0;
    while(pos < code.length && guard++ < 200000){
      let best = null;
      for(const rule of rules){
        rule.re.lastIndex = pos;
        const m = rule.re.exec(code);
        if(m && m[0].length && (!best || m.index < best.i)){ best = { i:m.index, t:m[0], c:rule.cls }; }
        if(best && best.i === pos) break;
      }
      if(!best){ out += esc(code.slice(pos)); pos = code.length; break; }
      if(best.i > pos) out += esc(code.slice(pos, best.i));
      out += '<span class="tok-' + best.c + '">' + esc(best.t) + '</span>';
      pos = best.i + best.t.length;
    }
    if(pos < code.length) out += esc(code.slice(pos));
    return out;
  }

  // Markdown source highlighting for the editor overlay
  const MD_RULES = [
    r(/^ {0,3}(?:```|~~~).*$/m, 'fence'),
    r(/^ {0,3}#{1,6} .*$/m, 'h'),
    r(/^ {0,3}(?:\*\s*){3,}$|^ {0,3}(?:-\s*){3,}$|^ {0,3}(?:_\s*){3,}$/m, 'hr'),
    r(/^ {0,3}>.*$/m, 'quote'),
    r(/^[ \t]*(?:[-*+]|\d{1,9}[.)])[ \t]+/m, 'list'),
    r(/^[ \t]*\|.*\|[ \t]*$/m, 'tbl'),
    r(/^ {0,3}\[[^\]]+\]:.*$/m, 'ref'),
    r(/`[^`\n]+`/, 'code'),
    r(/!?\[[^\]\n]*\]\([^)\n]*\)/, 'link'),
    r(/<\/?[A-Za-z][^>\n]*>/, 'html'),
    r(/\*\*\*[^*\n]+\*\*\*|___[^_\n]+___/, 'bold'),
    r(/\*\*[^*\n]+\*\*|__[^_\n]+__/, 'bold'),
    r(/(?<!\*)\*[^*\n]+\*(?!\*)|(?<![\w_])_[^_\n]+_(?!\w)/, 'ital'),
    r(/~~[^~\n]+~~/, 'strike'),
    r(/(?:https?:\/\/|www\.)[^\s<>()]+/, 'url')
  ];

  function highlightMd(src){
    if(src.length > 400000) return esc(src);
    let out = '', pos = 0, guard = 0;
    while(pos < src.length && guard++ < 400000){
      let best = null;
      for(const rule of MD_RULES){
        rule.re.lastIndex = pos;
        let m;
        try { m = rule.re.exec(src); } catch(e){ m = null; }
        if(m && m[0].length && (!best || m.index < best.i)) best = { i:m.index, t:m[0], c:rule.cls };
        if(best && best.i === pos) break;
      }
      if(!best){ out += esc(src.slice(pos)); pos = src.length; break; }
      if(best.i > pos) out += esc(src.slice(pos, best.i));
      out += '<span class="md-' + best.c + '">' + esc(best.t) + '</span>';
      pos = best.i + best.t.length;
    }
    if(pos < src.length) out += esc(src.slice(pos));
    return out;
  }

  return { highlight, highlightMd, langs: Object.keys(LANGS) };
})();

/* ==========================================================================
   3. APP
   ========================================================================== */
(function(){
  const $ = id => document.getElementById(id);
  const editor = $('editor'), edHigh = $('edHigh'), lineNums = $('lineNums');
  const preview = $('preview'), prevScroll = $('prevScroll');
  const fnameEl = $('fname'), statsEl = $('stats'), rstatsEl = $('rstats');

  let fileName = 'untitled.md';
  let fileHandle = null;
  let dirty = false;
  let lastHtml = '';
  const state = {
    sync: true, wrap: false, hlSrc: true, allowHtml: false, edit: true,
    theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'
  };

  /* ---------- persistence of preferences + last document ---------- */
  const LS = {
    get(k, d){ try { const v = localStorage.getItem('mdr.' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem('mdr.' + k, JSON.stringify(v)); } catch(e){} }
  };

  /* ---------- toast ---------- */
  // clipboard, with a fallback for browsers that block the async API on file://
  function copyText(text){
    const done = () => true;
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text).then(done, legacyCopy);
      }
    } catch(err){}
    return Promise.resolve(legacyCopy());
    function legacyCopy(){
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return true;
      } catch(err){ return false; }
    }
  }

  let toastT;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
  }

  /* ---------- rendering ---------- */
  let renderT = null, hlT = null;

  function setDirty(d){
    dirty = d;
    fnameEl.innerHTML = MD.esc(fileName) + (d ? ' <span class="dirty">&#9679;</span>' : '');
  }

  function updateStats(){
    const v = editor.value;
    const words = (v.match(/[A-Za-z0-9\u00c0-\uffff'’-]+/g) || []).length;
    const lines = v.length ? v.split('\n').length : 0;
    statsEl.textContent = lines + ' lines · ' + v.length.toLocaleString() + ' chars';
    rstatsEl.textContent = words.toLocaleString() + ' words · ~' + Math.max(1, Math.round(words / 220)) + ' min read';
  }

  function renderNow(){
    const src = editor.value;
    let res;
    try {
      res = MD.render(src, { allowHtml: state.allowHtml, highlight: HL.highlight });
    } catch(err){
      preview.innerHTML = '<p style="color:var(--danger)"><b>Render error:</b> ' + MD.esc(err.message) + '</p>';
      console.error(err); return;
    }
    lastHtml = res.html;
    preview.innerHTML = res.html;
    buildToc(res.headings);
    renderMermaid();
    updateStats();
    applyEditMode();
    focusPending();
  }

  function scheduleRender(){
    clearTimeout(renderT);
    renderT = setTimeout(renderNow, editor.value.length > 120000 ? 400 : 110);
  }

  function paintSource(){
    if(!state.hlSrc){ return; }
    edHigh.innerHTML = HL.highlightMd(editor.value) + '\n';
    edHigh.scrollTop = editor.scrollTop;
    edHigh.scrollLeft = editor.scrollLeft;
  }
  function schedulePaint(){
    if(!state.hlSrc) return;
    clearTimeout(hlT);
    hlT = setTimeout(paintSource, editor.value.length > 120000 ? 300 : 60);
  }

  let lastLineCount = -1;
  function paintLineNums(){
    if(state.wrap) return;
    const n = editor.value.split('\n').length;
    if(n === lastLineCount) { lineNums.scrollTop = editor.scrollTop; return; }
    lastLineCount = n;
    let s = '';
    for(let i = 1; i <= n; i++) s += i + '\n';
    lineNums.textContent = s;
    lineNums.scrollTop = editor.scrollTop;
  }

  function onInput(){
    setDirty(true);
    paintLineNums();
    schedulePaint();
    scheduleRender();
    LS.set('doc', editor.value.length < 400000 ? editor.value : '');
    LS.set('docName', fileName);
  }

  /* ---------- outline ---------- */
  function buildToc(headings){
    const list = $('tocList');
    if(!headings.length){ list.innerHTML = '<div class="empty">No headings.</div>'; return; }
    list.innerHTML = headings.map(h =>
      '<a class="l' + h.level + '" href="#' + h.id + '" title="' + MD.esc(h.text) + '">' + MD.esc(h.text) + '</a>'
    ).join('');
  }
  $('tocList').addEventListener('click', e => {
    const a = e.target.closest('a'); if(!a) return;
    e.preventDefault();
    const el = preview.querySelector('#' + CSS.escape(a.getAttribute('href').slice(1)));
    if(el) prevScroll.scrollTo({ top: el.offsetTop - 10, behavior:'smooth' });
  });
  preview.addEventListener('click', e => {
    const a = e.target.closest('a');
    // in edit mode links are text — ctrl/cmd-click to actually follow one
    if(a && state.edit && !e.ctrlKey && !e.metaKey && a.getAttribute('href') &&
       a.getAttribute('href').charAt(0) !== '#'){
      e.preventDefault(); return;
    }
    if(a && a.getAttribute('href') && a.getAttribute('href').charAt(0) === '#'){
      e.preventDefault();
      const el = preview.querySelector('#' + CSS.escape(a.getAttribute('href').slice(1)));
      if(el) prevScroll.scrollTo({ top: el.offsetTop - 10, behavior:'smooth' });
      return;
    }
    const c = e.target.closest('.cpy');
    if(c){
      const code = c.parentElement.querySelector('code');
      copyText(code.textContent);
      c.textContent = 'Copied'; setTimeout(() => { c.textContent = 'Copy'; }, 1200);
    }
  });

  /* ---------- mermaid (optional, loaded from CDN when online) ---------- */
  let mermaidState = 'idle'; // idle | loading | ready | unavailable
  function renderMermaid(){
    const boxes = preview.querySelectorAll('.mermaid-box[data-mermaid]');
    if(!boxes.length) return;
    if(mermaidState === 'unavailable'){ boxes.forEach(markUnavailable); return; }
    if(mermaidState === 'ready'){ draw(boxes); return; }
    if(mermaidState === 'loading') return;
    mermaidState = 'loading';
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    s.onload = () => {
      try {
        window.mermaid.initialize({ startOnLoad:false, securityLevel:'strict',
          theme: state.theme === 'dark' ? 'dark' : 'default' });
        mermaidState = 'ready';
        draw(preview.querySelectorAll('.mermaid-box[data-mermaid]'));
      } catch(e){ mermaidState = 'unavailable'; }
    };
    s.onerror = () => {
      mermaidState = 'unavailable';
      preview.querySelectorAll('.mermaid-box[data-mermaid]').forEach(markUnavailable);
    };
    document.head.appendChild(s);
  }
  function markUnavailable(box){
    if(box.querySelector('.mm-note')) return;
    const n = document.createElement('div');
    n.className = 'mm-note';
    n.textContent = 'mermaid diagram (renderer needs an internet connection — showing source)';
    box.appendChild(n);
  }
  let mmId = 0;
  function draw(boxes){
    boxes.forEach(box => {
      const code = box.getAttribute('data-mermaid');
      const id = 'mmd' + (++mmId);
      try {
        window.mermaid.render(id, code).then(res => {
          box.innerHTML = res.svg; box.removeAttribute('data-mermaid');
        }).catch(() => markUnavailable(box));
      } catch(e){ markUnavailable(box); }
    });
  }

  /* ---------- scroll sync ---------- */
  let lock = 0;
  function pct(el){ const d = el.scrollHeight - el.clientHeight; return d > 0 ? el.scrollTop / d : 0; }
  editor.addEventListener('scroll', () => {
    if(state.hlSrc){ edHigh.scrollTop = editor.scrollTop; edHigh.scrollLeft = editor.scrollLeft; }
    lineNums.scrollTop = editor.scrollTop;
    if(!state.sync || lock === 2) return;
    lock = 1;
    prevScroll.scrollTop = pct(editor) * (prevScroll.scrollHeight - prevScroll.clientHeight);
    requestAnimationFrame(() => lock = 0);
  }, { passive:true });
  prevScroll.addEventListener('scroll', () => {
    if(!state.sync || lock === 1) return;
    lock = 2;
    editor.scrollTop = pct(prevScroll) * (editor.scrollHeight - editor.clientHeight);
    requestAnimationFrame(() => lock = 0);
  }, { passive:true });

  /* ---------- editor niceties ---------- */
  editor.addEventListener('input', onInput);
  editor.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd, v = editor.value;
      if(s !== en && v.slice(s, en).indexOf('\n') !== -1){
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        const block = v.slice(ls, en);
        const nb = e.shiftKey ? block.replace(/^ {1,2}/gm, '') : block.replace(/^/gm, '  ');
        editor.setRangeText(nb, ls, en, 'select');
      } else {
        editor.setRangeText('  ', s, en, 'end');
      }
      onInput(); return;
    }
    if(mod && !e.shiftKey && (e.key === 'b' || e.key === 'i' || e.key === 'k' || e.key === 'e')){
      e.preventDefault();
      const wrapMap = { b:['**','**'], i:['*','*'], e:['`','`'], k:['[',']()'] };
      const [a, z] = wrapMap[e.key];
      const s = editor.selectionStart, en = editor.selectionEnd, sel = editor.value.slice(s, en);
      editor.setRangeText(a + sel + z, s, en, 'end');
      if(e.key === 'k') editor.selectionStart = editor.selectionEnd = s + sel.length + 3;
      onInput(); return;
    }
    if(e.key === 'Enter' && !mod){
      // continue lists
      const s = editor.selectionStart, v = editor.value;
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const cur = v.slice(ls, s);
      const m = cur.match(/^(\s*)(?:([-*+])|(\d{1,9})([.)]))(\s+)(\[[ xX]\]\s+)?/);
      if(m){
        if(cur.trim() === m[0].trim()){ // empty item → break out
          e.preventDefault();
          editor.setRangeText('', ls, s, 'end'); onInput(); return;
        }
        e.preventDefault();
        const marker = m[2] ? m[2] : (parseInt(m[3], 10) + 1) + m[4];
        const box = m[6] ? '[ ] ' : '';
        editor.setRangeText('\n' + m[1] + marker + m[5] + box, s, editor.selectionEnd, 'end');
        onInput(); return;
      }
    }
  });

  /* ---------- toolbar ---------- */
  function setView(v){
    document.body.classList.remove('view-split','view-source','view-preview');
    document.body.classList.add('view-' + v);
    ['bSplit','bSrc','bPrev'].forEach(id => $(id).classList.toggle('on', $(id).dataset.view === v));
    LS.set('view', v);
    if(v !== 'preview') requestAnimationFrame(() => { paintSource(); paintLineNums(); });
  }
  $('bSplit').onclick = () => setView('split');
  $('bSrc').onclick   = () => setView('source');
  $('bPrev').onclick  = () => setView('preview');

  function setTheme(t){
    state.theme = t;
    document.documentElement.dataset.theme = t;
    $('bTheme').textContent = t === 'dark' ? 'Light' : 'Dark';
    LS.set('theme', t);
    if(mermaidState === 'ready'){ mermaidState = 'idle'; renderNow(); }
  }
  $('bTheme').onclick = () => setTheme(state.theme === 'dark' ? 'light' : 'dark');

  function toggle(btn, key, after){
    $(btn).onclick = () => {
      state[key] = !state[key];
      $(btn).classList.toggle('on', state[key]);
      LS.set(key, state[key]);
      if(after) after();
    };
  }
  toggle('bSync', 'sync');
  toggle('bWrap', 'wrap', () => {
    document.body.classList.toggle('wrap', state.wrap);
    editor.setAttribute('wrap', state.wrap ? 'soft' : 'off');
    lastLineCount = -1; paintLineNums(); paintSource();
  });
  toggle('bHl', 'hlSrc', () => {
    document.body.classList.toggle('nohl', !state.hlSrc);
    if(state.hlSrc) paintSource();
  });
  toggle('bHtml', 'allowHtml', renderNow);
  $('bToc').onclick = () => { $('toc').classList.toggle('open'); $('bToc').classList.toggle('on'); };

  /* ---------- file open / new / save ---------- */
  function loadText(text, name){
    editor.value = text;
    fileName = name || 'untitled.md';
    lastLineCount = -1;
    setDirty(false);
    paintLineNums(); paintSource(); renderNow();
    editor.scrollTop = 0; prevScroll.scrollTop = 0;
    LS.set('doc', text.length < 400000 ? text : ''); LS.set('docName', fileName);
  }

  $('bOpen').onclick = async () => {
    if(window.showOpenFilePicker){
      try {
        const [h] = await window.showOpenFilePicker({
          types:[{ description:'Markdown', accept:{ 'text/markdown':['.md','.markdown','.mdown','.mkd','.mdx'], 'text/plain':['.txt'] } }]
        });
        fileHandle = h;
        const f = await h.getFile();
        loadText(await f.text(), f.name);
        toast('Opened ' + f.name);
        return;
      } catch(err){ if(err && err.name === 'AbortError') return; }
    }
    $('file').click();
  };
  $('file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    fileHandle = null;
    const r = new FileReader();
    r.onload = () => { loadText(r.result, f.name); toast('Opened ' + f.name); };
    r.readAsText(f);
    e.target.value = '';
  };
  $('bNew').onclick = () => {
    if(dirty && !confirm('Discard unsaved changes?')) return;
    fileHandle = null; loadText('', 'untitled.md');
  };

  async function save(){
    commitActive();
    const text = editor.value;
    if(fileHandle && fileHandle.createWritable){
      try {
        const w = await fileHandle.createWritable();
        await w.write(text); await w.close();
        setDirty(false); toast('Saved ' + fileName); return;
      } catch(err){ /* fall through to download */ }
    }
    if(window.showSaveFilePicker){
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: fileName,
          types:[{ description:'Markdown', accept:{ 'text/markdown':['.md'] } }]
        });
        fileHandle = h;
        const w = await h.createWritable();
        await w.write(text); await w.close();
        fileName = h.name; setDirty(false); toast('Saved ' + fileName); return;
      } catch(err){ if(err && err.name === 'AbortError') return; }
    }
    download(fileName, text, 'text/markdown');
    setDirty(false);
  }
  $('bSave').onclick = save;

  function download(name, content, mime){
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Downloaded ' + name);
  }

  /* ---------- export ---------- */
  function standaloneHtml(){
    // pull the preview-related CSS out of this page so the export looks identical
    let css = '';
    for(const sheet of document.styleSheets){
      try { for(const rule of sheet.cssRules) css += rule.cssText + '\n'; } catch(e){}
    }
    const title = fileName.replace(/\.[^.]+$/, '');
    return '<!DOCTYPE html>\n<html lang="en" data-theme="' + state.theme + '">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + MD.esc(title) + '</title>\n' +
      '<style>\n' + css + '\nbody{display:block;overflow:auto}#preview{padding:40px 24px}\n</style>\n</head>\n' +
      '<body><article id="preview">' + lastHtml + '</article></body>\n</html>';
  }
  $('selExport').onchange = e => {
    const v = e.target.value; e.target.value = '';
    commitActive();
    if(v === 'html') download(fileName.replace(/\.[^.]+$/, '') + '.html', standaloneHtml(), 'text/html');
    else if(v === 'pdf') window.print();
    else if(v === 'chtml'){ copyText(lastHtml); toast('Rendered HTML copied'); }
    else if(v === 'ctext'){ copyText(preview.innerText || preview.textContent); toast('Plain text copied'); }
  };

  /* ---------- drag & drop ---------- */
  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    if(!e.dataTransfer || Array.from(e.dataTransfer.types).indexOf('Files') === -1) return;
    dragDepth++; $('drop').classList.add('on');
  });
  window.addEventListener('dragleave', () => { if(--dragDepth <= 0){ dragDepth = 0; $('drop').classList.remove('on'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', async e => {
    e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on');
    const items = e.dataTransfer.items;
    if(items && items[0] && items[0].getAsFileSystemHandle){
      try {
        const h = await items[0].getAsFileSystemHandle();
        if(h && h.kind === 'file'){
          fileHandle = h;
          const f = await h.getFile();
          loadText(await f.text(), f.name); toast('Opened ' + f.name); return;
        }
      } catch(err){}
    }
    const f = e.dataTransfer.files[0]; if(!f) return;
    fileHandle = null;
    const r = new FileReader();
    r.onload = () => { loadText(r.result, f.name); toast('Opened ' + f.name); };
    r.readAsText(f);
  });

  /* ---------- global keys ---------- */
  window.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    const k = e.key.toLowerCase();
    if(k === 's'){ e.preventDefault(); save(); }
    else if(k === 'o'){ e.preventDefault(); $('bOpen').click(); }
    else if(k === 'p' && e.shiftKey){ e.preventDefault(); setView('preview'); }
    else if(k === '\\'){ e.preventDefault(); setView(document.body.classList.contains('view-split') ? 'preview' : 'split'); }
  });
  window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

  /* ---------- splitter ---------- */
  (function(){
    const g = $('gutterDrag'), left = $('leftPane'), main = $('main');
    let dragging = false;
    g.addEventListener('mousedown', e => { dragging = true; g.classList.add('drag'); e.preventDefault(); document.body.style.cursor = 'col-resize'; });
    window.addEventListener('mousemove', e => {
      if(!dragging) return;
      const r = main.getBoundingClientRect();
      const p = Math.min(85, Math.max(15, ((e.clientX - r.left) / r.width) * 100));
      left.style.flexBasis = p + '%';
      LS.set('split', p);
    });
    window.addEventListener('mouseup', () => {
      if(!dragging) return;
      dragging = false; g.classList.remove('drag'); document.body.style.cursor = '';
      paintSource(); paintLineNums();
    });
    g.addEventListener('dblclick', () => { left.style.flexBasis = '50%'; LS.set('split', 50); });
  })();

  /* ======================================================================
     WYSIWYG PREVIEW EDITING
     Every block carries data-ls / data-le (source line range), so an edit
     rewrites only those lines and leaves the rest of the file untouched.
     ====================================================================== */
  const EDITABLE = 'p[data-ls],h1[data-ls],h2[data-ls],h3[data-ls],h4[data-ls],h5[data-ls],' +
                   'h6[data-ls],span.itx[data-ls],td[data-ls],th[data-ls],pre[data-code]>code';
  const PFX_Q  = /^([ \t]*(?:>[ \t]?)+(?:\[![A-Za-z]+\][ \t]*)?)/;
  const PFX_H  = /^([ \t]*#{1,6}[ \t]+)/;
  const PFX_LI = /^([ \t]*(?:[-*+]|\d{1,9}[.)])[ \t]+(?:\[[ xX]\][ \t]+)?)/;

  let pending = null, lastCell = null, commitT = null;

  function srcLines(){ return editor.value.split('\n'); }

  function applyLines(lines){
    const text = lines.join('\n');
    editor.value = text;
    lastLineCount = -1;
    paintLineNums(); schedulePaint(); updateStats(); setDirty(true);
    LS.set('doc', text.length < 400000 ? text : ''); LS.set('docName', fileName);
  }

  // replace source lines [ls..le] (le < ls means "insert at ls") and keep other blocks' maps valid
  function spliceSource(ls, le, newLines, host, skipShift){
    const lines = srcLines();
    const count = Math.max(0, le - ls + 1);
    lines.splice(ls, count, ...newLines);
    const delta = newLines.length - count;
    applyLines(lines);
    if(skipShift) return;
    if(delta){
      preview.querySelectorAll('[data-ls]').forEach(n => {
        if(n === host) return;
        const a = +n.dataset.ls, b = +n.dataset.le;
        if(isFinite(a) && a > le){
          n.dataset.ls = a + delta;
          if(isFinite(b)) n.dataset.le = b + delta;
        } else if(isFinite(a) && isFinite(b) && a < ls && b >= ls){
          n.dataset.le = b + delta;                       // block that really encloses the edit
        }
      });
    }
    if(host){ host.dataset.ls = ls; host.dataset.le = ls + newLines.length - 1; }
  }

  /* ---------- HTML → markdown (inline level) ---------- */
  function mdEsc(t, inTable){
    // HTML collapses newlines to spaces — only <br> is a real line break
    let s = String(t).replace(/ /g, ' ').replace(/\s*\n\s*/g, ' ').replace(/([\\`*\[\]])/g, '\\$1');
    if(inTable) s = s.replace(/\|/g, '\\|');
    return s;
  }
  function ser(node, inTable){
    let out = '';
    node.childNodes.forEach(n => {
      if(n.nodeType === 3){ out += mdEsc(n.nodeValue, inTable); return; }
      if(n.nodeType !== 1) return;
      if(n.classList && (n.classList.contains('anchor') || n.classList.contains('lang') || n.classList.contains('cpy'))) return;
      const t = n.tagName.toLowerCase();
      const kids = () => ser(n, inTable);
      let c;
      switch(t){
        case 'strong': case 'b': c = kids(); out += c.trim() ? '**' + c + '**' : c; break;
        case 'em': case 'i':     c = kids(); out += c.trim() ? '*' + c + '*' : c; break;
        case 'del': case 's': case 'strike': c = kids(); out += c.trim() ? '~~' + c + '~~' : c; break;
        case 'mark': c = kids(); out += c.trim() ? '==' + c + '==' : c; break;
        case 'code': {
          let x = n.textContent.replace(/\n/g, ' ').replace(/`/g, '');
          out += x ? '`' + x + '`' : '';
          break;
        }
        case 'br': out += '\n'; break;
        case 'u': out += '<u>' + kids() + '</u>'; break;
        case 'kbd': out += '<kbd>' + kids() + '</kbd>'; break;
        case 'input': break;
        case 'img': {
          const alt = n.getAttribute('alt') || '', src = n.getAttribute('src') || '';
          out += '![' + alt + '](' + src + (n.title ? ' "' + n.title + '"' : '') + ')';
          break;
        }
        case 'sup':
          if(n.classList.contains('fnref')) out += '[^' + (n.id || '').replace(/^fnref-/, '') + ']';
          else { c = kids(); out += c ? '^' + c + '^' : ''; }
          break;
        case 'a': {
          const href = n.getAttribute('href') || '';
          c = kids();
          if(!href){ out += c; break; }
          if(c && (href === c || href === 'https://' + c || href === 'mailto:' + c)){ out += c; break; }
          out += c ? '[' + c + '](' + href + (n.title ? ' "' + n.title + '"' : '') + ')' : '';
          break;
        }
        default: out += kids();
      }
    });
    return out;
  }

  /* ---------- prefixes, wrapping ---------- */
  function prefixOf(line, kind){
    line = line || '';
    const q = line.match(PFX_Q);
    const quote = q ? q[1] : '';
    const rest = line.slice(quote.length);
    let body;
    if(kind === 'h'){ const m = rest.match(PFX_H); body = m ? m[1] : (rest.match(/^[ \t]*/) || [''])[0]; }
    else if(kind === 'li'){ const m = rest.match(PFX_LI); body = m ? m[1] : (rest.match(/^[ \t]*/) || [''])[0]; }
    else body = (rest.match(/^[ \t]*/) || [''])[0];
    return { quote, pfx: quote + body };
  }
  function wrapText(t, width){
    if(width < 20 || t.length <= width) return [t];
    const words = t.split(/ +/), lines = [];
    let cur = '';
    for(const w of words){
      if(!cur) cur = w;
      else if((cur + ' ' + w).length <= width) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    }
    if(cur) lines.push(cur);
    return lines.length ? lines : [''];
  }

  /* ---------- table row helpers ---------- */
  function rowParts(line){
    const m = (line || '').match(/^([ \t]*(?:>[ \t]?)*[ \t]*)([\s\S]*)$/);
    let lead = m[1], body = m[2].replace(/[ \t]+$/, '');
    let open = false, close = false;
    if(body.charAt(0) === '|'){ open = true; body = body.slice(1); }
    if(body.length && body.charAt(body.length - 1) === '|' && body.charAt(body.length - 2) !== '\\'){
      close = true; body = body.slice(0, -1);
    }
    const cells = []; let cur = '', tick = false;
    for(let k = 0; k < body.length; k++){
      const ch = body[k];
      if(ch === '`') tick = !tick;
      if(ch === '|' && !tick && body[k-1] !== '\\'){ cells.push(cur); cur = ''; }
      else cur += ch;
    }
    cells.push(cur);
    return { lead, open, close, cells };
  }
  function rowJoin(p){ return p.lead + (p.open ? '|' : '') + p.cells.join('|') + (p.close ? '|' : ''); }

  function fmtTable(rows, lead){
    const n = Math.max.apply(null, rows.map(r => r.cells.length));
    rows.forEach(r => { while(r.cells.length < n) r.cells.push('   '); });
    const w = [];
    for(let k = 0; k < n; k++){
      let mx = 3;
      rows.forEach((r, ri) => { if(ri !== 1) mx = Math.max(mx, r.cells[k].trim().length); });
      w[k] = mx;
    }
    return rows.map((r, ri) => {
      const cells = r.cells.map((c, k) => {
        const t = c.trim();
        if(ri === 1){
          const l = t.charAt(0) === ':', rt = t.charAt(t.length - 1) === ':';
          return ' ' + (l ? ':' : '') + '-'.repeat(Math.max(1, w[k] - (l?1:0) - (rt?1:0))) + (rt ? ':' : '') + ' ';
        }
        return ' ' + t + ' '.repeat(Math.max(0, w[k] - t.length)) + ' ';
      });
      return lead + '|' + cells.join('|') + '|';
    });
  }

  /* ---------- commit an edited block back to the markdown ---------- */
  function commitCell(el){
    const ln = +el.dataset.ls, ci = +el.dataset.ci;
    if(!isFinite(ln) || !isFinite(ci)) return;
    const lines = srcLines();
    if(lines[ln] == null) return;
    const p = rowParts(lines[ln]);
    while(p.cells.length <= ci) p.cells.push('   ');
    p.cells[ci] = ' ' + ser(el, true).replace(/\n+/g, ' ').trim() + ' ';
    lines[ln] = rowJoin(p);
    applyLines(lines);
  }

  function commit(el){
    if(!el || !el.isConnected || !state.edit) return;
    const tag = el.tagName.toLowerCase();
    if(tag === 'td' || tag === 'th') return commitCell(el);
    const host = tag === 'code' ? el.parentElement : el;
    const ls = +host.dataset.ls, le = +host.dataset.le;
    if(!isFinite(ls) || !isFinite(le)) return;
    const lines = srcLines();
    // for a not-yet-existing block (le < ls) take the prefix from the line above it
    const first = ((le < ls ? lines[ls - 1] : lines[ls]) || '');
    let newLines;

    if(tag === 'code'){
      const pfx = host.dataset.indent
        ? ((first.match(/^([ \t]*)/) || ['','    '])[1] || '    ')
        : prefixOf(first, 'p').pfx;
